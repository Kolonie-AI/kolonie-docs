name: Review a pull request

# The Reviewer Agent `operations/review-guidelines.md` used to promise in the
# present tense (#42). Until this existed, every citizen pull request waited for
# the operator to read it — which is what #37 means when it says the human is
# structurally in the loop no matter what the ledger records.
#
# ## Where it runs, and why the issue's preference is reversed
#
# #42 left this open and leaned towards a job on the VPS, because a GitHub Action
# "does not run on fork PRs without care around secret exposure — which is the
# exact case we need it for."
#
# The premise is right and the conclusion does not follow. `pull_request_target`
# and `workflow_run` both run in the **base** repository's context, with secrets
# and a writable token, for a pull request from a fork. What is dangerous is
# checking out the fork's code and running it — that is what hands a stranger the
# token. The only checkout here is `Kolonie-AI/kolonie-docs@main`, so the
# reusable caller can import the shared transport; the pull request under review
# is never on disk. `inbound-triage.yml` in this repository already makes exactly
# this argument and has been labelling fork pull requests since #41.
#
# So the fork case is not an argument for the VPS, and everything else favours
# the Action: no service to operate, no deploy chain, no polling delay, and the
# review appears while the contributor is still looking at the page. Recorded in
# `state/decisions.md`.
#
# ## Why `workflow_run` and not `pull_request_target`
#
# `review-guidelines.md` says *"CI must pass before review begins"*, and that is
# the one rule in the document a machine can enforce rather than request. On
# `opened`, CI has not started — the reviewer would have to poll, and a reviewer
# that polls will eventually review something it should not have. Hanging the
# review off CI's completion makes the rule structural: there is no code path
# here that runs before a build has a verdict.
#
# It also means the reviewer sees `synchronize` for free, because CI does.
#
# ## What it may never do
#
# **Approve a red or unfinished build.** The job exits before reading a diff.
#
# **Approve a change to the ledger, the verifiers or governance.** Those are
# forced to `COMMENT` whatever the model says. `kolonie-platform/AGENTS.md` §87:
# a process that could reward its own results cannot gate itself, and a reviewer
# that can approve the code paying out coins is exactly that.
#
# **Push a commit.** It reviews the diff. Nothing here writes to a branch.

on:
  workflow_call:
    inputs:
      model:
        description: >-
          Which capability tier to ask of both gateways. A repository variable
          `REVIEWER_LLM_MODEL` overrides this when set. The default is the
          reviewer tier, not a vendor slug: both gateways are asked for the
          same string (`kolonie-docs#547`).
        type: string
        required: false
        default: "@preset/tier-2"
      sensitive_paths:
        description: >-
          An extended regular expression over changed paths. A match forces the
          verdict to COMMENT — the review is still written and still specific,
          but a human decides. Widen it freely; the cost of a false positive is
          one maintainer reading a pull request they were going to read anyway.
        type: string
        required: false
        default: "(^|/)(ledger|governance)|packages/verifiers/|apps/verifier-runner/|red-lines|GOVERNANCE\\.md|/erasure"
    secrets:
      LLM_GATEWAY_API_KEY_REVIEWER:
        description: >-
          This service's own key on the primary LLM gateway
          (`kolonie-platform#674`). One key per service, so the Reviewer Agent's
          traffic can be read, capped or revoked without stopping the
          moderation queue. Not required: an unconfigured half is absent, and
          a reviewer that cannot reach a model must not be the reason a pull
          request looks broken.
        required: false
      LLM_GATEWAY_BASE_URL:
        description: >-
          Where the primary gateway is. **A secret rather than an input**,
          because it is a host of ours and `kolonie-platform#676` keeps it out
          of everything a reader can see — a workflow log is public on a
          public repository.
        required: false
      LLM_GATEWAY_FALLBACK_API_KEY_REVIEWER:
        description: >-
          This service's own key on the second gateway
          (`kolonie-docs#547`). Independently configured: unset means this
          reviewer has no second gateway, which is today's behaviour, not a
          startup failure.
        required: false
      LLM_GATEWAY_FALLBACK_BASE_URL:
        description: >-
          Where the second gateway is. A secret for the same reason as the
          primary URL. Unset with the matching key means no fallback.
        required: false
      LOKI_URL:
        description: >-
          The log store a successful fallback, or a day of silent non-reviews,
          is recorded in (`#503`). Optional: an absent store must not fail the
          review.
        required: false
      LOKI_TOKEN:
        description: The push credential for that store. Optional with LOKI_URL.
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout of the pull request. See the header — that is the property
      # that makes running with a writable token on a fork's pull request safe.
      # The kolonie-docs checkout later is this repository's `main`, never the
      # head under review.
      - name: Decide whether there is anything to review, and gather it
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SENSITIVE_PATHS: ${{ inputs.sensitive_paths }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/review

          # Every way out of this step is a decision, so each one says what it
          # decided. Written at the exit rather than defaulted at the top: a
          # default relies on a later line overwriting an earlier one, which is
          # true of GITHUB_OUTPUT today and is not a property worth depending on.
          skip() { echo "review=no" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          case "$RUN_EVENT" in
            pull_request|pull_request_target) ;;
            *) skip "triggered by '$RUN_EVENT' — no pull request to review" ;;
          esac

          # The enforced half of review-guidelines.md. Anything other than a
          # clean pass stops here, including `cancelled`: ci.yml cancels the
          # previous run on a new push, and reviewing an abandoned build wastes
          # a call and dates the review the moment it is posted.
          if [ "$CONCLUSION" != "success" ]; then
            skip "CI concluded '$CONCLUSION' — review does not begin before a build passes"
          fi

          pr=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
                 --jq '[.[] | select(.state == "open")][0].number' 2>/dev/null || true)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            skip "no open pull request heads ${HEAD_SHA}"
          fi

          gh pr view "$pr" --repo "$REPO" \
            --json number,title,body,author,isDraft,additions,deletions,files \
            > /tmp/review/pr.json

          if [ "$(jq -r .isDraft /tmp/review/pr.json)" = true ]; then
            skip "PR #${pr} is a draft — not reviewing until it is marked ready"
          fi

          # GitHub refuses APPROVE and REQUEST_CHANGES from the account that
          # opened the pull request. The token here acts as github-actions[bot],
          # which authors nothing, but a pull request opened *by* a workflow
          # would hit it — so the verdict is capped rather than the call failed.
          author=$(jq -r .author.login /tmp/review/pr.json)
          if [ "$author" = "github-actions[bot]" ]; then
            echo "self_review=yes" >> "$GITHUB_OUTPUT"
          fi

          # **Capped, and the cap is a real number rather than a gesture.** A
          # 400 KB diff is not reviewable by anything, and sending it costs
          # tokens to produce a review that reads like a summary. Truncation is
          # reported to the model *and* in the posted review, because a reader
          # who is not told is a reader who thinks the rest was checked.
          gh pr diff "$pr" --repo "$REPO" > /tmp/review/diff.full 2>/dev/null || true
          head -c 240000 /tmp/review/diff.full > /tmp/review/diff.txt
          if [ "$(wc -c < /tmp/review/diff.full)" -gt 240000 ]; then
            echo "truncated=yes" >> "$GITHUB_OUTPUT"
          fi

          if [ ! -s /tmp/review/diff.txt ]; then
            skip "PR #${pr} has an empty diff"
          fi

          # The acceptance criteria are the standard the review is measured
          # against, so they are fetched whole rather than summarised. Resolved
          # the way GitHub resolves them, which covers both `Fixes #12` and a
          # link made through the sidebar.
          : > /tmp/review/issues.md
          gh api graphql -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F number="$pr" -f query='
            query($owner:String!, $name:String!, $number:Int!) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$number) {
                  closingIssuesReferences(first: 10) {
                    nodes { number title body repository { nameWithOwner } }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                     | "## \(.repository.nameWithOwner)#\(.number) — \(.title)\n\n\(.body)\n"' \
            >> /tmp/review/issues.md 2>/dev/null || true

          if [ ! -s /tmp/review/issues.md ]; then
            printf 'No issue is linked to this pull request.\n' > /tmp/review/issues.md
          fi

          # The standard itself, from main rather than from a checkout — there is
          # no checkout, and reading it out of the pull request under review
          # would let a contributor supply the rules they are judged by.
          curl -sSL --max-time 30 \
            https://raw.githubusercontent.com/Kolonie-AI/kolonie-docs/main/operations/review-guidelines.md \
            -o /tmp/review/guidelines.md || : > /tmp/review/guidelines.md

          # Whichever paths matched is carried forward, so the review can say
          # *which* file made it a human's call rather than asserting it.
          #
          # Through the environment, never interpolated into the command. An
          # Actions expression is pasted into the script before bash sees it,
          # so a value containing a quote would be running as shell rather than
          # as a pattern — the standard GitHub Actions injection, and it costs
          # one variable to close.
          #
          # This paragraph wrote that syntax out in full until 2026-08-01, and
          # the workflow had never once run. The parser scans a `run:` block for
          # expressions and does not know it is reading a shell comment, so an
          # empty pair of delimiters here is an empty expression there. See
          # operations/incidents.md.
          jq -r '.files[].path' /tmp/review/pr.json \
            | grep -E "$SENSITIVE_PATHS" > /tmp/review/sensitive.txt || true
          [ -s /tmp/review/sensitive.txt ] && echo "sensitive=yes" >> "$GITHUB_OUTPUT"

          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "review=yes" >> "$GITHUB_OUTPUT"
          echo "reviewing PR #${pr} — $(jq -r .additions /tmp/review/pr.json) additions, $(jq -r .deletions /tmp/review/pr.json) deletions"

      # The reusable caller lives in every repository. The transport and this
      # script live in kolonie-docs. Checking out **this repository's `main`**
      # is not checking out the pull request under review: the gather step
      # still never reads a stranger's tree, and the token never sees it.
      - name: Fetch the reviewer from kolonie-docs
        if: steps.gather.outputs.review == 'yes'
        uses: actions/checkout@v4
        with:
          repository: Kolonie-AI/kolonie-docs
          ref: main
          path: kolonie-docs
          persist-credentials: false

      - name: Ask the model for a verdict
        id: model
        if: steps.gather.outputs.review == 'yes'
        env:
          TRUNCATED: ${{ steps.gather.outputs.truncated }}
          LLM_GATEWAY_API_KEY_REVIEWER: ${{ secrets.LLM_GATEWAY_API_KEY_REVIEWER }}
          LLM_GATEWAY_BASE_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
          LLM_GATEWAY_FALLBACK_API_KEY_REVIEWER: ${{ secrets.LLM_GATEWAY_FALLBACK_API_KEY_REVIEWER }}
          LLM_GATEWAY_FALLBACK_BASE_URL: ${{ secrets.LLM_GATEWAY_FALLBACK_BASE_URL }}
          REVIEWER_LLM_MODEL: ${{ vars.REVIEWER_LLM_MODEL || inputs.model }}
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_TOKEN: ${{ secrets.LOKI_TOKEN }}
        run: |
          set -euo pipefail
          python3 kolonie-docs/.github/scripts/review-pull-request.py

      - name: Post the review
        if: steps.model.outputs.ok == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.gather.outputs.pr }}
          SENSITIVE: ${{ steps.gather.outputs.sensitive }}
          SELF_REVIEW: ${{ steps.gather.outputs.self_review }}
          TRUNCATED: ${{ steps.gather.outputs.truncated }}
          MODEL: ${{ vars.REVIEWER_LLM_MODEL || inputs.model }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/review/payload.json
          import json, os

          v = json.load(open("/tmp/review/verdict.json"))
          event = {"approve": "APPROVE", "request_changes": "REQUEST_CHANGES"}.get(
              str(v.get("verdict", "")).lower(), "COMMENT")

          # What the model decided, kept separately from what GitHub is asked to
          # record. Every downgrade below changes the second; the heading reports
          # the first, because "this reviewer would have approved" and "a human
          # has to look at this one" are different things to tell a contributor
          # and both arrive as event=COMMENT.
          verdict = event

          caps = []
          # The cap that matters, and it is not advisory. AGENTS.md §87 in
          # kolonie-platform: a process that could reward its own results cannot
          # gate itself, and the ledger is what pays.
          if os.environ.get("SENSITIVE") == "yes" and event == "APPROVE":
              paths = open("/tmp/review/sensitive.txt").read().split()
              caps.append("**A human decides this one.** It changes "
                          + ", ".join(f"`{p}`" for p in paths[:6])
                          + (" and others" if len(paths) > 6 else "")
                          + " — the ledger, the verifiers and governance are never approved automatically.")
              event = "COMMENT"
          if os.environ.get("SELF_REVIEW") == "yes" and event != "COMMENT":
              caps.append("Downgraded to a comment: GitHub does not accept a verdict from the account that opened the pull request.")
              event = "COMMENT"
          # **APPROVE is never sent, and this is a platform rule rather than a
          # preference.** GitHub answers `422 GitHub Actions is not permitted to
          # approve pull requests` for a review posted with the Actions token,
          # unless an organisation setting is turned on that lets any workflow
          # approve any pull request. Found on the first pull request this
          # reviewer ever saw — kolonie-platform#214 on 2026-08-02, where the
          # whole job succeeded up to the last call and the contributor received
          # nothing at all. A reviewer that is silent exactly when it agrees with
          # you is worse than one that does not run.
          #
          # The verdict is not lost, it moves into the body. That costs nothing
          # here because the approval was never a gate: no repository requires a
          # review to merge (kolonie-docs#96), and review-guidelines.md says a
          # pull request still merges by a human's hand.
          #
          # The alternative — enabling "Allow GitHub Actions to create and
          # approve pull requests" — was rejected. It is an organisation-wide
          # switch that would let every workflow approve, for a verdict that
          # already carries no authority.
          if event == "APPROVE":
              caps.append("Posted as a comment rather than an approval: GitHub does not let a workflow approve a pull request. The verdict above is the verdict.")
              event = "COMMENT"
          if os.environ.get("TRUNCATED") == "yes":
              caps.append("**The diff was truncated at 240 KB.** Anything past that point was not read.")

          out = [f"### Automated review — {verdict.replace('_', ' ').lower()}", "",
                 v.get("summary", "").strip(), ""]
          for c in caps:
              out += [f"> {c}", ""]

          crit = [c for c in v.get("criteria", []) if isinstance(c, dict)]
          if crit:
              mark = {"met": "✅", "unmet": "❌", "unverified": "❔"}
              out += ["#### Acceptance criteria", "", "| | Criterion | Evidence |", "|---|---|---|"]
              for c in crit:
                  cell = lambda s: str(s or "").replace("|", "\\|").replace("\n", " ")
                  out.append(f"| {mark.get(c.get('status'), '❔')} | {cell(c.get('criterion'))} | {cell(c.get('evidence'))} |")
              out.append("")

          finds = [f for f in v.get("findings", []) if isinstance(f, dict)]
          if finds:
              out += ["#### Findings", ""]
              order = {"blocking": 0, "question": 1, "nit": 2}
              for f in sorted(finds, key=lambda f: order.get(f.get("severity"), 3)):
                  where = f.get("path") or "?"
                  if f.get("line"):
                      where += f":{f['line']}"
                  out.append(f"- **{f.get('severity', 'note')}** — `{where}`  \n  {f.get('comment', '').strip()}")
              out.append("")

          unchecked = [u for u in v.get("unchecked", []) if u]
          if unchecked:
              out += ["#### Not checked", ""] + [f"- {u}" for u in unchecked] + [""]

          out += ["---", "",
                  f"Written by the Reviewer Agent (`{os.environ['MODEL']}`) against "
                  "[`operations/review-guidelines.md`](https://github.com/Kolonie-AI/kolonie-docs/blob/main/operations/review-guidelines.md) "
                  "and the linked issue's acceptance criteria — [`kolonie-docs#42`](https://github.com/Kolonie-AI/kolonie-docs/issues/42).",
                  "",
                  "It ran because CI passed; it never approves a red or missing build, and it read the diff only — "
                  "no test was executed and no claim here about a test passing should be believed. "
                  "A maintainer still merges."]

          print(json.dumps({"event": event, "body": "\n".join(out)}))
          PY

          gh api "repos/${REPO}/pulls/${PR}/reviews" \
            --method POST \
            --input /tmp/review/payload.json \
            --jq '"posted review \(.id): \(.state)"'
