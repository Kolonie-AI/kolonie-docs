name: Watch Agent

# Reads yesterday out of Loki, says what it saw in its own run summary, and opens
# an issue when a service has stopped logging. Silence when nothing is wrong.
# `kolonie-docs#133`, split by `kolonie-docs#165`.
#
# ## Why it runs here and not on the VPS
#
# **A watcher that dies with the thing it watches is not a watcher.** Everything
# it reads lives on one host; if that host goes, a monitor on it goes with it and
# reports nothing, which looks exactly like a quiet night. So it runs in Actions,
# and the cost is that Loki has to be reachable from outside behind a token —
# which `kolonie-infra#68` provides at `logs.kolonie.ai`.
#
# ## The failure this workflow itself has
#
# **GitHub disables scheduled workflows in a repository with no activity for 60
# days.** A repository nobody touches loses its watchdog silently, which is
# precisely the shape of failure this exists to catch. Nothing here can fix that
# — a workflow cannot notice it has been switched off.
#
# What covers it is `kolonie-infra#69`: a liveness check that runs off this host
# *and* off Actions. If that issue is ever closed as not-worth-doing, this
# paragraph is the argument against, and it should be re-read first.
#
# **The lesser failure used to be described here as covered, and it is not.**
# This file claimed that a run which fails notifies through GitHub in the ordinary
# way. That belief was load-bearing — it is why no workflow here watched another
# one — and `kolonie-docs#193` falsified it: `Rehearse` was red on `main` for two
# days, four consecutive failing runs, found on the fourth by accident.
#
# The claim held once and the difference is worth naming rather than assuming.
# `incidents.md`'s 2026-08-01 entry begins with the maintainer reporting *"a
# stream of GitHub emails"* about `review.yml`, and that is how that defect was
# found — but that was **nineteen consecutive failures of a workflow that had
# never once succeeded**, so the notification was both loud and anomalous. The
# `Rehearse` case was four failures of a workflow that had been green the day
# before, arriving beside successful `CI` and `Reviewer Agent` runs on the same
# commits. **The ordinary notification is a good alarm for a workflow that is
# broken and a poor one for a workflow that has just broken.**
#
# What covers it now is `red-on-main.yml`, a sibling of `board-self-check.yml`
# that asks daily whether any workflow's most recent completed run on `main`
# concluded `failure`. `kolonie-docs#132` remains the day nobody ran a check for
# long enough that it mattered; `#193` is the day something ran one and nobody
# read it.
#
# ## What it may never do
#
# **It reads.** It restarts nothing, edits nothing, and closes no issue — not
# even its own, which is where it deliberately differs from `board-self-check.yml`
# next door. A bad day in the logs does not become untrue; whoever reads the
# issue decides when it is finished with.
#
# ## Two halves, and only one of them needs a model
#
# `watch-agent.sh` runs the queries and answers *which services said nothing*,
# with no model call and no key. `watch-judge.py` asks whether the counts are
# normal, and every way it can fail ends in exit 0 with no judgement written —
# the numbers then stand on their own and the summary says the judgement was
# skipped. A provider outage costs an opinion, never the check.
#
# ## Two jobs, and only one of them files (`#165`)
#
# The daily narrative — how yesterday compared with the week — **is this run's
# summary and opens nothing.** A report that never resolves is not work, and
# filing it as an issue produced exactly one issue, forever, with every finding
# as a comment on it.
#
# The alarm — a service that has stopped logging — **files one issue per
# service**, closeable, with the service's name in the title.
#
# The model's verdict files nothing now. What took over the path from *an error
# appeared* to *an issue exists* is the log detector in `kolonie-platform#407`,
# which ticks every half hour rather than once a day. This split waited for that
# to exist: removing the alarm half first would have left the Colony with less
# than it had.

on:
  schedule:
    # 06:00 UTC — an hour after board-self-check, so two daily jobs that both
    # talk to the GitHub API do not contend in the same minute, and late enough
    # that the 24-hour window it reads is yesterday as somebody in Europe would
    # mean it.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      break_it:
        description: >-
          Force a finding, to exercise the reporting path end to end. `#133`'s
          definition of done requires this to have happened once and the issue it
          opens inspected. It queries a service name that does not exist, so the
          silent-service check finds it missing, and it fabricates a burst of
          gateway fallbacks so `#312`'s finding takes the same path — nothing on
          the host is touched and no model call is made to produce either.
        type: boolean
        required: false
        default: false

# `watch-agent.sh` waits for its own issue to become findable before it exits
# (`kolonie-docs#150`), and this stops a `break_it` dispatch from starting while
# the scheduled run is inside that wait. Queued, never cancelled: a cancelled run
# is one that filed and then did not wait.
concurrency:
  group: watch-agent-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The only write it holds, and the whole of `#133`'s "it holds no write access
  # beyond opening an issue". No `pull-requests`, no `actions`, no `packages`.
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # First, because this check is silent when it passes, and a silent check
      # nobody has exercised is one nobody should trust. Same argument as
      # board-self-check.yml's.
      - name: Test the agent
        run: bash .github/tests/watch-agent.test.sh

      - name: Read yesterday
        id: gather
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_TOKEN: ${{ secrets.LOKI_TOKEN }}
          # A service that has certainly not logged in the last day, because it
          # has never existed. `watch-agent.sh` appends it while it is still
          # building the report, so it appears in the issue body as well as in
          # the decision — appended afterwards it reached the decision only, and
          # the first rehearsal filed an issue saying nothing was silent.
          # Nothing on the host is touched either way.
          WATCH_FORCE_SILENT: ${{ inputs.break_it && 'a-service-that-does-not-exist' || '' }}
          # `#312`: the gateway finding is the second thing this workflow can
          # file, and a rehearsal that exercised only the first would leave the
          # newer path in the state the older one was in before `#156` — written,
          # plausible, and never actually run. Above the burst threshold on
          # purpose, so it is the finding rather than a line in the report.
          WATCH_FORCE_FALLBACKS: ${{ inputs.break_it && '9' || '' }}
        run: |
          # No pipeline, and the status is captured rather than allowed to
          # propagate: Actions runs `run:` under `bash -e`, so `script | tee`
          # would abort the step on the script's own exit code before any line
          # below could read it. board-self-check.yml learned this on 2026-08-03.
          rc=0
          bash .github/scripts/watch-agent.sh gather "$RUNNER_TEMP/watch" > "$RUNNER_TEMP/out.txt" || rc=$?
          cat "$RUNNER_TEMP/out.txt"

          if [ "$rc" -eq 2 ]; then
            # The store could not be read. Reported in the log and nowhere else:
            # a check that cannot reach its subject must not be the reason the
            # subject looks broken — and here it would file "every service is
            # silent", which would be true and useless.
            echo "::warning::Loki could not be read — configuration gap, not a finding; see the job log"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

          if [ -n "${WATCH_FORCE_SILENT:-}" ]; then
            echo "::warning::running with a fabricated silent service and a fabricated gateway burst — this is the rehearsal, not a real finding"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Ask whether it is normal
        if: steps.gather.outputs.skip != 'true'
        env:
          # Its own key, so the Watch Agent's spend is separable from every other
          # model caller's (kolonie-infra#70). Optional by design — see the
          # workflow comment above and watch-judge.py's docstring.
          OPENROUTER_API_KEY_WATCH: ${{ secrets.OPENROUTER_API_KEY_WATCH }}
          MODEL: deepseek/deepseek-v4-flash
        run: python3 .github/scripts/watch-judge.py "$RUNNER_TEMP/watch"

      # The narrative, in the run's own output (`#165`). Written whether or not
      # anything is wrong, and it is the whole of what a good day produces —
      # there is no all-clear issue and no all-clear comment.
      - name: Yesterday, in this run
        if: steps.gather.outputs.skip != 'true'
        run: bash .github/scripts/watch-agent.sh summary "$RUNNER_TEMP/watch" >> "$GITHUB_STEP_SUMMARY"

      - name: File, if a service has gone silent
        if: steps.gather.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if bash .github/scripts/watch-agent.sh decide "$RUNNER_TEMP/watch"; then
            echo "nothing was wrong — filing nothing, which is the healthy outcome"
            exit 0
          fi
          bash .github/scripts/watch-agent.sh report "$RUNNER_TEMP/watch"
