name: Push the shared skill body to the seven

# The Colony-facing half of every `SKILL.md` lives once, here, in
# `onboarding/skill/`. The seven runtime repositories regenerate against it and
# open a pull request when it has moved — `skill.yml` in each of them, on a cron
# at `17 6 * * *`. This asks the same seven to do that **now** instead of
# tomorrow morning.
#
# ## What made a daily clock the wrong one
#
# `#359`. `kolonie.browser.share.*` was withdrawn on 2026-08-14 at 15:26 and the
# generated copies had last been written at 10:40 that morning, so six of the
# seven distributed skill files documented three tools, a sequence and a wake
# event that all answered `-32602 Tool not found`. Nothing was broken and nothing
# was skipped: `sync` proposed the removal the next morning exactly as designed.
#
# **What was never weighed is that one kind of body change cannot wait for a
# daily clock.** An ordinary edit arriving within a day costs a slightly stale
# sentence. A *withdrawal* arriving within a day costs an agent following a
# document it was told to follow, into a tool that is gone —
# `withdrawn-browser-share.test.ts` in `kolonie-platform` already argues this one
# step further in, about the name answering as unknown rather than as forbidden:
#
# > *you may not* is a thing to go and earn, and an agent told that about a
# > withdrawn channel spends a rung's worth of effort on a door that no longer
# > has a wall around it.
#
# A skill file that still documents the channel is the same failure further out,
# and worse, because the agent does not meet a wall at all. It meets a document.
#
# ## The human gate is untouched, and that is the point
#
# This changes **latency and nothing else**. `sync` still regenerates, still
# opens a pull request, and still does not merge — a change reaching seven
# repositories at once stays a decision a person takes seven times. What was up
# to a day plus the review is now minutes plus the review.
#
# The cron in each of the seven stays exactly where it is, as the fallback. Same
# arrangement as `board-triage.yml`'s schedule behind the host timer: the fast
# path is an optimisation over a clock that still works on its own.
#
# ## Why a token, and why neither empty ending is green (`#500`, `#531`)
#
# `GITHUB_TOKEN` reaches this repository and no other, so dispatching a workflow
# in `kolonie-claude` needs a credential that spans them. That credential is a
# short-lived installation token as the organisation-owned **Kolonie Skill
# Publisher** App, minted here from `SKILL_PUBLISHER_APP_ID` /
# `SKILL_PUBLISHER_APP_PRIVATE_KEY`. The App is installed on the seven runtimes
# and not on this repository; minting here, dispatching there, is the whole of
# `#531`. A user PAT is not read anywhere on this path — `#501` already retired
# that shape inside each runtime's `skill.yml` when the account was suspended,
# and this workflow was the remaining reader.
#
# The two states are still told apart, which is the same distinction
# `kolonie-platform#971` is about one repository over. What `#500` changes is
# that **neither of them is conclusion success** — `#359` is closed, so an
# unreadable token is a broken fast path rather than an unfinished one:
#
#   - **no token** — nothing can be dispatched. A `::error::`, a step summary
#     naming the one setting to change, and **exit 1**. This used to be
#     `::warning::` and exit 0 so an unfinished wiring would not turn `main`
#     red; measured 2026-08-25 that is exactly how run 32908682526 dispatched
#     none of the seven and reported success.
#   - **a token, and a dispatch that did not land** — this is wired up and
#     broken. `::error::` and exit 1, because the fast path silently not working
#     is precisely the failure `#359` is about, one level up.
#
# ## Why the logic is a script (`#500`)
#
# The distinction above was written down here and enforced by nothing. Measured
# 2026-08-25: a push of the shared body produced run 32908682526 — event `push`,
# conclusion **success**, 7s — having dispatched **none** of the seven. The
# second state above is exactly what happened, and it reported as the first.
#
# A `run:` block cannot be exercised by a test, so the endings now live in
# `.github/scripts/skill-dispatch.sh` and are asserted in
# `.github/tests/skill-dispatch.test.sh`, which this workflow runs before it
# dispatches anything — the arrangement `board-triage.yml` and
# `waiting-for-an-agent.yml` already use. The first state above is what the live
# run measured: no readable token, none of the seven asked, conclusion success.
# **A shortfall of any size is red**: six of seven is the case that reads as
# success from a distance, and the seventh keeps serving withdrawn text until
# its own cron.
#
# ## What it may never do
#
# **It does not merge anything, in any repository.** It asks seven workflows to
# run. Each of them decides for itself whether the body has moved, and each of
# them opens a pull request a person reads.
#
# **It does not re-run or restart anything here** — `watch-agent.yml`'s rule.

on:
  push:
    branches: [main]
    # The generated half only. `skill.runtime.md` is each runtime's own file and
    # does not live here; a change to anything else in this repository moves no
    # `SKILL.md` and must not wake seven repositories to discover that.
    paths:
      - "onboarding/skill/**"
  # For a body that moved before this workflow existed, and for testing it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push to the shared body while the first round of dispatches is
  # still going makes the first round pointless: `sync` regenerates against
  # `main` at the moment it runs, so the later dispatch subsumes the earlier.
  group: skill-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    name: ask the seven to regenerate now
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The seven live in `skill-dispatch.sh`, beside the loop that reads them,
      # rather than here. They were in both places for as long as the logic was
      # a `run:` block, and two records of one fact is what `#378` and
      # `AGENTS.md` §4 refuse — the script is the one a test can check.

    steps:
      # The dispatch is a script so that it can be tested (`#500`). A `run:`
      # block cannot be exercised by anything: the ending measured on
      # 2026-08-25 — no readable token, no dispatch attempt, conclusion success —
      # is only assertable if the logic is callable from a test.
      - uses: actions/checkout@v4

      - name: The dispatch logic is tested before it is trusted
        run: bash .github/tests/skill-dispatch.test.sh

      # One short-lived token, scoped to the seven runtimes the App is
      # installed on. This repository is not one of them: it holds the secrets
      # so it can mint, then dispatches into the seven (`#531`). The pin is
      # the same SHA `kolonie-claude` `skill.yml` already uses.
      - name: Become the skill publisher App
        id: publisher_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.SKILL_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.SKILL_PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kolonie-skill
            kolonie-claude
            kolonie-codex
            kolonie-hermes
            kolonie-kilo
            kolonie-openclaw
            kolonie-antigravity

      - name: Ask them
        env:
          SKILL_PUBLISHER_TOKEN: ${{ steps.publisher_token.outputs.token }}
        run: bash .github/scripts/skill-dispatch.sh
