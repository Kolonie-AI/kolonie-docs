name: Triage inbound contributions

# The half of the contribution process that runs on our side (#41).
#
# ## Why this cannot be an issue template
#
# `.github/ISSUE_TEMPLATE/*.md` carries `labels:` in its frontmatter and that
# frontmatter is applied by the **web UI only**. `gh issue create` and the REST
# API bypass templates entirely, and agents never use the web UI. So a template
# reaches exactly the contributors this project does not have.
#
# ## And it cannot be asked of the contributor either
#
# GitHub's REST API documents it for the create-issue endpoint:
#
# > Only users with push access can set labels for new issues. **Labels are
# > silently dropped otherwise.**
#
# The same applies to `assignees` and `milestone`. A citizen who read our docs
# carefully and passed `labels: ['p1', 'area:docs']` in the API call would watch
# it vanish without an error. Labelling is structurally ours. Nothing in the
# contributor-facing documents should ask for it — that would be advice that
# cannot be followed.
#
# ## What it deliberately does not do
#
# **It never assigns a priority.** `p1` and `p2` encode what the Colony is
# currently trying to achieve, which a contributor has no way to know and a
# workflow has no way to compute. `needs-triage` exists precisely so that the
# human step is visible rather than skipped.
#
# **It does not thank the Colony's own runners for a citizen's report** (`#413`).
# The Colony now files issues to itself — the log detector and the support
# triage runner both file as GitHub Apps this organisation runs — and until
# `#413` those arrived labelled `from:citizen` and `needs-triage`, and were
# thanked. Both labels were false: `from:citizen` is a claim about provenance,
# and it is a number the Colony has an interest in, so an automation that
# inflates it is worse than one that mislabels something inert. `needs-triage`
# was false because the detector had already routed the issue — right
# repository, right `area:` label, with its evidence. What such an issue needs
# is for somebody to read it, which is what `Inbox` already means.
#
# **It does not add anything to the project board.** It does not need to: the
# board's own auto-add rules cover all five repositories and were confirmed
# enabled on 2026-07-31, including `kolonie-website` and `kolonie-openclaw`,
# which #41 believed were uncovered. Doing it here would have cost a stored token
# with `project` scope — a long-lived credential for board hygiene, which
# `AGENTS.md` §6 already refused once for the same reason.

on:
  workflow_call:
    inputs:
      area:
        description: >-
          The `area:*` label for work filed in the calling repository, without
          the prefix — `platform`, `infra`, `docs`, `website`, `skills`,
          `governance`. Passed by the caller rather than derived from the
          repository name on purpose: `AGENTS.md` §5 states that area is not the
          same as repository, and a mapping table here would be a second place to
          remember a new repository in.
        type: string
        required: true

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label it, and say what is still missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_TYPE: ${{ github.event.issue.user.type }}
          AREA: ${{ inputs.area }}
          BODY: ${{ github.event.issue.body }}
          EXISTING: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail

          # Push access rather than organisation membership, because push access
          # is the thing the API actually keys the label restriction on. A member
          # without write on this repository is in the same position as a
          # stranger, and pretending otherwise would leave their issue unlabelled.
          if gh api "repos/${REPO}/collaborators/${AUTHOR}/permission" \
               --jq '.permission' 2>/dev/null | grep -qE '^(admin|write|maintain)$'; then
            has_push=true
          else
            has_push=false
          fi

          # Is this one of the Colony's own runners filing to itself? (`#413`)
          #
          # **The author is an App this organisation runs**, which is the broader
          # of the two tests the issue weighed and the reason it was chosen: it
          # covers the log detector and the support triage runner, which have the
          # same problem for the same reason, and it will cover the next one
          # without an edit here. Matching on a `log-signature` marker in the
          # body would have covered only the detector.
          #
          # A GitHub App can only open an issue in this repository if it is
          # installed on this organisation, which only an admin does — so the
          # `kolonie-` prefix cannot be claimed by a stranger, and no allowlist
          # has to be maintained.
          if [ "$AUTHOR_TYPE" = "Bot" ] && [[ "$AUTHOR" == kolonie-* ]]; then
            ours=true
          else
            ours=false
          fi

          had_labels=$(jq 'length > 0' <<< "$EXISTING")
          echo "author=$AUTHOR type=$AUTHOR_TYPE push=$has_push ours=$ours labels=$EXISTING"

          # An author with push access who labelled their own issue is doing the
          # thing this workflow exists to do, and gets left alone — that is the
          # "does nothing when it has nothing to do" criterion.
          if [ "$has_push" = true ] && [ "$had_labels" = true ]; then
            echo "labelled by someone who could label it: nothing to do"
            exit 0
          fi

          # **Every label this file applies is created here if the repository
          # does not have it.** Four repositories call this workflow and on
          # 2026-08-12 exactly one of them — `kolonie-platform` — had
          # `needs-triage`. The run on `kolonie-docs#313` failed with
          # `'needs-triage' not found`, and because `gh issue edit` applies its
          # labels in one call, the issue got **no** `area:` and **no** comment
          # either: an outside contributor's first interaction with the Colony
          # was silence, and a red workflow nobody was watching (`#285`).
          #
          # **Creating them here rather than by hand in each repository**, because
          # the hand fix leaves the next repository to call this broken in exactly
          # the same way, and the failure is silent from where the contributor is
          # standing. The set is closed and is `AGENTS.md` §5's — an `area:`, the
          # triage mark, and the one provenance label this file may apply — so
          # this cannot invent vocabulary.
          #
          # A label that already exists is left exactly as it is: no `--force`,
          # because a repository's own colour or description is not this file's
          # to overwrite.
          #
          # **Defined above the runner branch below and not beneath it** (`#407`).
          # It used to sit after that branch's `exit 0`, so the one path that
          # applies a label without passing through the net was the one path the
          # net could not reach — latent only because the repository missing its
          # `area:` label had had no bot-filed issue yet.
          ensure_label() {
            gh label create "$1" --repo "$REPO" --color "$2" --description "$3" >/dev/null 2>&1 \
              && echo "created the missing label $1" \
              || true
          }

          # The area's own description is the calling repository's to write, and
          # every one of them already has its area labels — this is the safety
          # net rather than the definition, so it says the least it can. In one
          # function because two callers apply it, and two spellings of one label
          # is how a repository ends up with two of them.
          ensure_area_label() {
            ensure_label "area:${AREA}" C5DEF5 "Work in the ${AREA} area"
          }

          # One of our own runners, which has already routed what it filed: right
          # repository, its evidence in the body, and — for the log detector —
          # its own `area:` label. What such an issue needs is a reader, which is
          # what `Inbox` already means.
          #
          # **`area:` is still applied if it is missing, and nothing else is.**
          # Exiting outright would have trusted every present and future runner
          # to label itself, which is a second promise this file cannot check;
          # adding the one label that is always true costs nothing and leaves the
          # two that were false out. No `from:citizen`, because there is no
          # citizen. No `needs-triage`, because the routing has happened. And no
          # comment, because nobody is being thanked for anything.
          if [ "$ours" = true ]; then
            if jq -e 'any(startswith("area:"))' <<< "$EXISTING" >/dev/null; then
              echo "filed by one of the Colony's own runners, already labelled: nothing to do"
            else
              ensure_area_label
              gh issue edit "$NUMBER" --repo "$REPO" --add-label "area:${AREA}"
              echo "filed by one of the Colony's own runners: applied area:${AREA} and nothing else"
            fi
            exit 0
          fi

          ensure_area_label
          ensure_label needs-triage ededed "Arrived from outside. A maintainer still has to look."

          labels="area:${AREA},needs-triage"

          # **Provenance is membership, and it is never `from:citizen`** (`#335`).
          #
          # This block used to apply `from:citizen` to any author without push
          # access, whatever route they came in by. Both halves of that were
          # wrong, and they were wrong in the direction this file's own header
          # calls worse than mislabelling something inert:
          #
          # **The wrong label.** `from:citizen` is defined as *derived from a
          # citizen's support ticket*, and a support ticket does not arrive
          # through GitHub — it arrives through `kolonie-triage`, which files as
          # an App and applies the label itself at creation. Measured 2026-08-13:
          # `kolonie-platform#866` carries it from `kolonie-triage[bot]`, which is
          # correct, and `#854`–`#861` carry it from this workflow, which is not.
          # Eight issues that `kateryna-sprintcx` filed directly with `gh` were
          # counted as citizen reports. `from:external` is what they are.
          #
          # **The wrong test.** Push access answers *could they have labelled it*,
          # which is the question the API keys on and the reason it is still read
          # above. It does not answer *are they outside the organisation*: a
          # member with no write on this repository has no push access and is not
          # external. `board-triage.sh` has always used membership for this and
          # says why at `#686` — the label must not be forgeable, and
          # `authorAssociation` reads `NONE` for a member who has never touched
          # the repository.
          #
          # **Three answers, not two, because this token may not be able to tell.**
          # `orgs/{org}/members/{user}` answers `204` for a member and `404` for
          # an outsider *only when the requester is itself an organisation
          # member*. `GITHUB_TOKEN` acts as the repository rather than as a
          # member, so it may get a `302` instead — and a `302` read as "not a
          # member" would put `from:external` on a colleague, which is the same
          # class of error in the other direction. So an inconclusive answer
          # applies nothing and leaves it to `board-triage.sh`, which runs within
          # the hour on an App token that can answer and sets the label only when
          # none is present. Silence here is a deferral, not a gap.
          #
          # **The route does not depend on any of this.** `OUTSIDE_PROVENANCE` is
          # `from:citizen from:external needs-triage`, and `needs-triage` is
          # applied unconditionally two lines above, so the priority is held for a
          # person and the route is capped at `agent:claude` from the moment the
          # issue is opened — including in the window before the sweep runs.
          if [ "$has_push" = false ]; then
            case "$(gh api "orgs/${REPO%%/*}/members/${AUTHOR}" -i 2>/dev/null | head -n1)" in
              *' 204'*) membership=member  ;;
              *' 404'*) membership=outside ;;
              *)        membership=unknown ;;
            esac
          else
            membership=member
          fi
          echo "membership=$membership"

          if [ "$membership" = outside ]; then
            # Ensured here rather than beside the other two, so a label is never
            # created on an issue it is not about to be applied to. Colour and
            # description are `board-triage.sh`'s, so the two writers of this
            # label cannot disagree about what it means.
            ensure_label from:external E4E669 "Opened from outside the organisation. Untrusted text."
            labels="${labels},from:external"
          elif [ "$membership" = unknown ]; then
            echo "provenance is not answerable with this token: left to board-triage.sh"
          fi

          # **The hold a person has to lift** (`#389`). `needs-clearance` says
          # nobody inside the organisation has looked at this yet; GitHub refuses
          # a label change from anyone without push access, so the asymmetry is
          # the platform's rather than a script's, and that is the only reason it
          # is worth relying on.
          #
          # **It is not `needs-triage` and does not replace it.** That label is
          # load-bearing inside `board-triage.sh`'s `OUTSIDE_PROVENANCE`, which
          # drives the priority guard and the `agent:claude` route cap. Merging
          # the two is a separate decision and `#389` says in as many words that
          # it must not be taken as a tidy-up while implementing this.
          #
          # **`unknown` is held and `from:external` still is not, and the
          # difference is what each label claims.** `from:external` is a *fact*
          # about where an issue came from: guessing it onto a colleague writes a
          # permanent falsehood that `board-triage.sh` will never correct, because
          # it only fills a `from:` in where none is present. `needs-clearance` is
          # a *state* — whether anybody has looked — and it is wrong in one
          # direction only for as long as it takes a member to click it off. No
          # sweep applies this label later, so an issue held here on an
          # inconclusive answer is held, and one not held here is never held at
          # all. Failing towards the removable error is the whole design.
          if [ "$membership" != member ]; then
            ensure_label needs-clearance B60205 \
              "Not cleared yet. Only an organisation member takes this off."
            labels="${labels},needs-clearance"
          fi

          gh issue edit "$NUMBER" --repo "$REPO" --add-label "$labels"
          echo "applied: $labels"

          # One comment, naming what is missing and nothing else. It is written
          # to be read by an agent as much as by a person: it says what happens
          # next, so that "no priority yet" does not read as "ignored".
          missing=""
          if ! grep -qiE '^#+ *(acceptance criteria|definition of done)' <<< "${BODY:-}"; then
            missing=$'\n- **Acceptance criteria.** What has to be true for this to be finished, in checkable statements rather than intentions. `AGENTS.md` §7 is the bar, and an issue reaches **Ready** only once it meets it.'
          fi

          comment="Thanks — this is on the board and labelled \`area:${AREA}\`."
          comment+=$'\n\nWhat happens next, so that none of it reads as a rejection:\n\n'

          # Only for an author who genuinely could not have done it. Telling a
          # maintainer that they were unable to set a label they were perfectly
          # able to set is a small thing, and it is the kind of small thing that
          # teaches a reader to stop believing the rest of the message.
          if [ "$has_push" = false ]; then
            comment+='- **You could not have set these labels yourself.** GitHub drops `labels` silently for anyone without push access, so this is our job and not an omission on your part ([`kolonie-docs#41`](https://github.com/Kolonie-AI/kolonie-docs/issues/41)).'
            comment+=$'\n'
          fi

          comment+='- **Priority is deliberately not set.** `p1`/`p2` encode what the Colony is trying to achieve right now, which is ours to know. `needs-triage` means a maintainer still has to look — not that anything is wrong with the issue.'
          comment+="$missing"
          comment+=$'\n\nHow work is picked up is in [`AGENTS.md`](https://github.com/Kolonie-AI/kolonie-docs/blob/main/AGENTS.md) §6; the column an issue sits in is its status.'

          gh issue comment "$NUMBER" --repo "$REPO" --body "$comment"

  pull_request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout anywhere in this job, and that is the security property that
      # makes `pull_request_target` acceptable here. That trigger runs with a
      # writable token in the context of the *base* repository, so checking out
      # and running a fork's code would hand a stranger our token. This job only
      # ever calls the API about the pull request.
      #
      # It has to be `pull_request_target`: a plain `pull_request` from a fork
      # gets a read-only token and cannot label anything, and forks are precisely
      # the case this exists for.
      - name: Label it, inherit from the issue it closes, and comment on conventions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
          AREA: ${{ inputs.area }}
        run: |
          set -euo pipefail

          if gh api "repos/${REPO}/collaborators/${AUTHOR}/permission" \
               --jq '.permission' 2>/dev/null | grep -qE '^(admin|write|maintain)$'; then
            has_push=true
          else
            has_push=false
          fi

          labels=""
          add() { labels="${labels:+$labels,}$1"; }

          # The issue job's guarantee, made here too (`#407`). Four of the paths
          # below apply `area:${AREA}` and none of them created it, so this job
          # was one caller away from the failure `#285` fixed in the other one:
          # `gh pr edit` applies its labels in one call, and an unknown name
          # costs the contributor the `area:`, the `from:` and the conventions
          # comment together. Measured 2026-08-15: `kolonie-skill` had no
          # `area:skills`, and its run failed with `'area:skills' not found`.
          #
          # Same colour and same description as the issue job writes, because
          # two spellings of one label is how a repository ends up with two of
          # them. A label that exists is left alone: no `--force`.
          ensure_area_label() {
            gh label create "area:${AREA}" --repo "$REPO" --color C5DEF5 \
              --description "Work in the ${AREA} area" >/dev/null 2>&1 \
              && echo "created the missing label area:${AREA}" \
              || true
          }

          # The same correction as the issue job above, and `from:citizen` was
          # even less defensible here: a pull request is not a support ticket by
          # any route at all, so the label could never have been true of one.
          # Same three-way answer, same deferral when the token cannot tell —
          # except that no sweep covers pull requests, so an unknown here stays
          # unlabelled rather than being picked up later. That is the honest
          # outcome: nothing downstream reads a pull request's `from:` label, and
          # a guess would feed the count this issue exists to stop inflating.
          if [ "$has_push" = false ]; then
            case "$(gh api "orgs/${REPO%%/*}/members/${AUTHOR}" -i 2>/dev/null | head -n1)" in
              *' 404'*)
                # Created if the calling repository does not have it, for the
                # reason the issue job spells out at `#285`: `gh pr edit` applies
                # its labels in one call, so one missing label costs the
                # contributor the `area:` and the comment as well. All four
                # callers have it today; the fifth is why this is here.
                gh label create from:external --repo "$REPO" --color E4E669 \
                  --description "Opened from outside the organisation. Untrusted text." >/dev/null 2>&1 || true
                add "from:external" ;;
            esac
          fi

          # Inherit area and priority from the issue this closes, rather than
          # inventing either. A pull request is not a second place to decide what
          # something is — it is work on something already decided.
          issue=$(grep -oiE '\b(fixes|closes|resolves) +#[0-9]+' <<< "${BODY:-}" | head -n1 | grep -oE '[0-9]+' || true)

          # The issue the **title** names, which is a different claim from the one
          # above and the whole of `#387`. House style ends a title `(#n)`, and a
          # squash merge carries that subject onto `main` — where it closes
          # nothing, because `Closes #n` in the body is what does. `board-self-check.sh`
          # already says that in as many words; what it cannot see is the result,
          # because an open issue whose card is still in Ready is what an
          # untouched issue looks like. So it is caught here, while somebody is
          # looking at the pull request, or not at all.
          titled=$(grep -oE '\(#[0-9]+\) *$' <<< "$TITLE" | grep -oE '[0-9]+' || true)
          # GitHub's own squash subject is `… (#<this pull request>)`. A title
          # naming itself is that, and not a reference to anything.
          [ "$titled" = "$NUMBER" ] && titled=""
          # And it has to be an issue that exists. `gh issue view` answers for a
          # pull request too, so the kind is checked rather than assumed —
          # otherwise a title ending in some other pull request's number produces
          # a confident sentence about an issue nobody filed.
          if [ -n "$titled" ] \
             && ! gh issue view "$titled" --repo "$REPO" --json id >/dev/null 2>&1; then
            titled=""
          fi

          notes=""
          # Kept apart from `notes` on purpose. `notes` is introduced as a list
          # that fails nothing and needs no action, which is exactly right for a
          # branch name — and is why the generic version of the warning below was
          # skipped on `#384` by the person who had just written the pull request
          # (`#387`). A thing worth doing before merge cannot be filed under a
          # heading that says nothing here is worth doing.
          flags=""
          if [ -n "$issue" ]; then
            inherited=$(gh issue view "$issue" --repo "$REPO" --json labels \
              --jq '[.labels[].name | select(startswith("area:") or . == "p1" or . == "p2")] | join(",")' 2>/dev/null || true)
            if [ -n "$inherited" ]; then
              add "$inherited"
              echo "inherited from #$issue: $inherited"
            else
              add "area:${AREA}"
            fi
          elif [ -n "$titled" ]; then
            # The title named it, so it is as good a source of `area:` and
            # priority as a closing keyword would have been — same argument as
            # above, that a pull request does not re-decide what something is.
            inherited=$(gh issue view "$titled" --repo "$REPO" --json labels \
              --jq '[.labels[].name | select(startswith("area:") or . == "p1" or . == "p2")] | join(",")' 2>/dev/null || true)
            if [ -n "$inherited" ]; then
              add "$inherited"
              echo "inherited from the title's #$titled: $inherited"
            else
              add "area:${AREA}"
            fi
            # `$'\n'` rather than a literal line break, exactly as the notes
            # below are written. A continuation line starts at column 1 and a
            # line at column 1 ends the `run: |` block scalar, so the workflow
            # stops being parseable YAML — which `rehearse-triage.sh` says in
            # those words rather than by failing a case.
            flags="${flags}"$'\n'"- **The title says this is \`#${titled}\`, and the body closes nothing.** A subject ending \`(#n)\` closes no issue — only \`Closes #${titled}\` in the body does. Merge it as it stands and the work lands while [\`#${titled}\`](https://github.com/${REPO}/issues/${titled}) stays open on its board column, where \`pick\` can hand it to the next agent as unstarted work. Add the line, or say in the body why this only partly answers it — a pull request that deliberately leaves an issue open is a real thing and \`kolonie-platform#899\` is one."
          else
            add "area:${AREA}"
            notes="${notes}"$'\n- **No issue is referenced.** A pull request that closes no issue is not automatically wrong, but it should say so deliberately — add `Fixes #<n>`, or a line explaining why there is none. Without it nothing links the work to the decision behind it.'
          fi

          # Conventional Commits, per onboarding/contributor-guide.md §Commit
          # Messages. A comment, never a failed check: a title is renamed in
          # three seconds and a red X on someone's first contribution is a
          # disproportionate way to ask for it.
          #
          # **Skipped for an author with push access, exactly as the branch-name
          # note below already is, and for the same reason** (`#387`). That guide
          # is written for contributions from a fork — *"create a branch from
          # `main` in your fork"* — and the house style inside the organisation is
          # a prose subject ending `(#n)`. So this note fired on essentially every
          # internal pull request, which made the whole comment boilerplate: a
          # block whose first line promises nothing in it needs fixing and whose
          # contents are reliably not worth reading is a block readers learn to
          # skip, and then the one line that did matter is skipped with it. That
          # is not hypothetical — it is what happened on `#384`.
          if [ "$has_push" = false ] \
             && ! grep -qE '^(feat|fix|docs|test|chore|refactor|perf|build|ci|style|revert)(\([^)]+\))?!?: .+' <<< "$TITLE"; then
            notes="${notes}"$'\n- **The title is not a conventional commit.** `feat: …`, `fix: …`, `docs: …`, `test: …` — see [contributor-guide.md](https://github.com/Kolonie-AI/kolonie-docs/blob/main/onboarding/contributor-guide.md#commit-messages). Nothing is blocked by this.'
          fi

          # Branch naming, same file, same treatment. Skipped for an author with
          # push access working in this repository, where a branch is usually a
          # short-lived local thing rather than a contribution.
          if [ "$has_push" = false ] \
             && ! grep -qE '^(feature|fix|docs)/.+-[0-9]+$' <<< "$BRANCH"; then
            notes="${notes}"$'\n- **The branch name is not in the documented shape** — `feature/<slug>-<issue-number>`, `fix/…`, `docs/…`. Also not blocking, and not worth a force-push to correct on an open PR.'
          fi

          # Only when this job is the one deciding the area. The inheriting paths
          # above take their labels off an issue that already carries them, and
          # a label read off an issue in this repository exists in it.
          case ",${labels}," in
            *",area:${AREA},"*) ensure_area_label ;;
          esac

          gh pr edit "$NUMBER" --repo "$REPO" --add-label "$labels"
          echo "applied: $labels"

          if [ -n "$notes" ] || [ -n "$flags" ]; then
            comment=$'Thanks for the pull request — it is labelled and on the board.\n\n'
            # Flags first, under their own heading, and the heading does not
            # promise that nothing here matters. **Still nothing is failed and
            # nothing is blocked** — `#387` is explicit that a partial answer to
            # an issue stays legitimate, and turning `main` red over a missing
            # keyword would be worse than the thing it catches.
            if [ -n "$flags" ]; then
              comment+=$'**Worth a look before this merges.** Nothing here fails a check or blocks the merge:\n'
              comment+="$flags"
              comment+=$'\n'
              [ -n "$notes" ] && comment+=$'\n'
            fi
            if [ -n "$notes" ]; then
              comment+=$'A few conventions, none of which fail anything and none of which need fixing before review:\n'
              comment+="$notes"
            fi
            comment+=$'\n\nThe Reviewer Agent reads this once CI has passed, and a maintainer reads the review ([`kolonie-docs#42`](https://github.com/Kolonie-AI/kolonie-docs/issues/42)). It never approves a red build and never approves a change to the ledger, the verifiers or governance. If you are an agent, **check back on this pull request yourself** — neither the review nor the merge will reach you any other way ([`kolonie-docs#43`](https://github.com/Kolonie-AI/kolonie-docs/issues/43)).'
            gh pr comment "$NUMBER" --repo "$REPO" --body "$comment"
          fi
