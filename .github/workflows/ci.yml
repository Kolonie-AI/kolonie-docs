name: CI

# The general slot. `kolonie-docs#124` measured that a pull request editing
# `ARCHITECTURE.md` here ran **nothing** — `Check Red Lines` is path-filtered to
# six files and `Rehearse` to `.github/**`, so most pull requests arrived with a
# checks list that was short enough to look deliberate rather than empty.
#
# ## Why the name is exactly `CI`
#
# `review-pull-request.yml` is called by `on: workflow_run: workflows: [CI]`.
# The name is the wiring: with it, the Reviewer Agent attaches to this
# repository by a copy of the caller that already exists in `kolonie-website`,
# with nothing to redesign. `#124` calls this the load-bearing detail and it is.
#
# ## Why these two checks and not something more impressive
#
# `#124`: *"a check that exists to satisfy a trigger is worse than no check,
# because it makes the checks list look answered."* Both of these are things
# somebody has run by hand here after an edit.
#
# **The link check** is this repository's characteristic breakage. It is a set of
# documents that point at each other, and a link that stops resolving is invisible
# to every reader who does not happen to click it. It found two on the day it was
# written, both in `onboarding/academy.md`, both pointing at a heading whose
# anchor carries two hyphens where the link wrote one.
#
# **The red lines, unconditionally.** `Check Red Lines` stays exactly as it is —
# `#124` is explicit that this issue adds the general slot rather than replacing
# the specific checks — and this job runs the same comparison with no path filter.
#
# **That second one couples this repository's CI to five others**, because the
# copies it compares live in the skill repositories. A divergence introduced
# somewhere else turns every pull request here red, including one that changes a
# typo. That is a real cost and it was accepted deliberately in `#124`'s decision
# table rather than overlooked: the red lines are the terms of citizenship, the
# divergence is silent by construction, and a repository whose pull requests are
# blocked until the copies agree is a repository that fixes them. **If that trade
# is re-argued, it is re-argued against this paragraph** — the alternative on the
# table was the link check alone.

on:
  push:
    branches: [main]
  # No path filter. That is the entire point of this workflow and it is an
  # acceptance criterion of #124, not an oversight to be tidied up later.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # `build-skill.test.py` is here rather than in the seven skill repositories
      # because the generator is here. Whether each `SKILL.md` is *current* is a
      # question only that repository can ask — its `skill.yml` does, on every
      # pull request — but whether the generator still joins the two halves
      # correctly is this repository's to answer, and it is the one failure that
      # would reach all seven at once.
      #
      # Both checks are tested before either runs, which is `check-red-lines.yml`'s
      # rule and `rehearse.yml`'s lesson before it: a check nobody verifies is a
      # suite nobody runs with a shorter fuse. The link check needs it more than
      # most — a parser bug there does not make it red, it makes it find nothing
      # and pass.
      - name: Test the checks
        run: |
          python3 .github/tests/check-links.test.py
          python3 .github/tests/red-lines.test.py
          python3 .github/tests/build-skill.test.py
          python3 .github/tests/build-readme.test.py
          python3 .github/tests/check-incident-order.test.py
          python3 .github/tests/check-brand-surfaces.test.py
          bash .github/tests/no-gateway-leak.test.sh
          bash .github/tests/opencode-worker.test.sh
          bash .github/tests/opencode-context.test.sh
          bash .github/tests/watch-finding.test.sh

      - name: Every internal Markdown link resolves
        run: python3 .github/scripts/check-links.py .

      # `#207`, asked for in as many words: the gateway's URL and key must not be
      # committed, *"and that is worth a check in CI rather than a habit."*
      #
      # What is guarded is mostly the **URL**. A key is rotated in a minute; a
      # private hostname in a public repository's history cannot be taken back,
      # and it is a target for as long as it resolves.
      #
      # The secrets are here so the check can grep for their **values** rather
      # than for a pattern — writing down what the hostname looks like is most of
      # the way to writing down the hostname. Nothing is ever printed, including
      # on failure; the script names the variable and the file and stops there.
      #
      # On a fork these are empty, the script says it skipped, and the step
      # passes. A check that failed there would block every outside contribution
      # for a reason nobody outside could act on.
      - name: Nothing about the private gateway is committed
        env:
          OPENCODE_LLM_BASE_URL: ${{ secrets.OPENCODE_LLM_BASE_URL }}
          OPENCODE_LLM_API_KEY: ${{ secrets.OPENCODE_LLM_API_KEY }}
        run: bash .github/scripts/no-gateway-leak.sh .

      # `kolonie-docs#190`. `operations/incidents.md` said *newest first* for six
      # days without being newest first, in four commits that each appended to the
      # end. It is the cheapest possible thing to get wrong — an entry in the wrong
      # place is identical, in the diff that adds it, to an entry in the right one —
      # and the cost is that the oldest entry reads as the end of the file, so
      # everything below it is unreachable by the file's own navigation.
      #
      # It shares the link check's failure mode and for the same reason its test
      # runs first: a parser that finds no headings reports a perfectly ordered
      # file. The check answers that with a floor and by treating an unreadable
      # heading as an error rather than a skip.
      - name: The incidents are still newest first
        run: python3 .github/scripts/check-incident-order.py operations/incidents.md

      # `kolonie-docs#219`. This repository is both the source of the shared
      # README header and one of the thirteen that carries it, so its check is
      # here rather than in a `readme.yml` of its own — there is no second
      # repository to check out and no pull request to open when the header
      # moves, because the header moving *is* the commit being checked.
      #
      # The other twelve run the same comparison from `.github/workflows/readme.yml`,
      # against `kolonie-docs@main`.
      # `kolonie-docs#224`. `#199` is the one issue here written to be a *record*
      # rather than a task, on the argument that nothing else would notice the
      # maintainer had acted. Something was done — the organisation avatar — and
      # the record did not close behind it, so `#199` and `brand/README.md` §3
      # both described an identicon that had already been replaced.
      #
      # **The mechanism `#199` bet on is the mechanism that failed**, and the
      # fourteen social previews it also covers would have failed the same way.
      # This is the replacement: two surfaces whose truth lives in somebody
      # else's settings page, read from GitHub and compared against what §3 says
      # about them. Red in either direction — a row that has stopped being true
      # is the whole point, and a row that says *Set* after somebody removed an
      # image is the same failure pointing the other way.
      #
      # It needs the token to reach GraphQL, which is where the answer is:
      # `#224` recommends `GET /repos/{owner}/{repo}` and that field is absent
      # from every REST response measured on 2026-08-08, ours and other
      # people's. `Repository.usesCustomOpenGraphImage` is a boolean and one
      # query covers the organisation.
      - name: brand/README.md §3 still describes the surfaces GitHub is serving
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check-brand-surfaces.py brand/README.md

      - name: README.md carries the current Colony header
        run: |
          python3 .github/scripts/build-readme.py \
            onboarding/readme/header.md README.md --first --check

      - name: The copies of the red lines still agree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          bash .github/scripts/find-red-line-copies.sh "$RUNNER_TEMP/copies"
          python3 .github/scripts/red-lines.py "$RUNNER_TEMP/copies"
