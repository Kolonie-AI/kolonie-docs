# Temporary diagnostic for kolonie-platform#728. Delete once #728 is closed.
# It asks the gateway twice from a runner, with urllib's default user agent and
# with the Reviewer Agent's own, and prints the status of each.
name: Gateway reachability probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the gateway with each user agent
        env:
          BASE: ${{ secrets.LLM_GATEWAY_BASE_URL }}
          KEY: ${{ secrets.LLM_GATEWAY_API_KEY_REVIEWER }}
          MODEL: ${{ secrets.LLM_GATEWAY_MODEL }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          base, key, model = os.environ["BASE"], os.environ["KEY"], os.environ["MODEL"]
          body = json.dumps({"model": model,
                             "messages": [{"role": "user", "content": "ping"}],
                             "max_tokens": 8}).encode()

          for label, ua in (("urllib default (nothing set)", None),
                            ("Kolonie-Reviewer-Agent/1.0", "Kolonie-Reviewer-Agent/1.0 (+https://github.com/Kolonie-AI)")):
              headers = {"Authorization": f"Bearer {key}", "Content-Type": "application/json"}
              if ua:
                  headers["User-Agent"] = ua
              req = urllib.request.Request(f"{base}/v1/chat/completions", data=body, headers=headers)
              try:
                  r = urllib.request.urlopen(req, timeout=60)
                  print(f"{label}: {r.status}")
              except urllib.error.HTTPError as e:
                  print(f"{label}: {e.code} — {e.read()[:120].decode(errors='replace')}")
              except Exception as e:
                  print(f"{label}: unreachable ({type(e).__name__})")
          PY
