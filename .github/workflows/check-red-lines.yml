name: Check Red Lines

# Do all the copies of the red lines still say the same thing? (`#79`)
#
# `#78` decided the entry-point skills carry the red lines verbatim, and named
# the divergence risk as the price of that decision rather than an unrelated
# defect. The terms of citizenship are the worst thing in the project to be wrong
# about, and the failure is silent by construction: no agent reads two copies, so
# nobody is positioned to notice.
#
# ## What the first version of this did, because this one is shaped around it
#
# It was added on 2026-07-31 and `#79` was closed four minutes later. It never
# passed — not once, not before the drift it was meant to catch. Every run
# reported one error: `about.ts` writes `platforms’` and `red-lines.md` writes
# `platforms'`, and it compared them byte for byte. It was red from birth for a
# curly apostrophe, so its signal was spent before it had anything to say.
#
# Then `#88` reworded a rule, and the check was wrong in three more ways at once:
# it did not read `kolonie-kilo` or `kolonie-claude` (both stale, both absent
# from its hard-coded list), and its parser took only the bullet list, so the
# reworded rule — now a named paragraph — silently stopped being compared at all.
#
# ## What is different
#
# **Comparison is on normalised content.** Punctuation and case fold away; the
# words are what must agree. `.github/scripts/red-lines.py` states what that
# gives up.
#
# **The copies are discovered.** `find-red-line-copies.sh` asks the API which
# repositories hold a `SKILL.md`. A skill repository added next month is checked
# next month, and a floor in the checker means under-discovery fails rather than
# passing on almost nothing.
#
# **This repository's own copies are read from the checkout** (`#301`). Three of
# the four named copies live here, and reading them over the API meant a pull
# request editing `red-lines.md` was compared against `main` — the commit that
# changed the rules was the one thing not examined. It also meant a slow response
# could turn this check red over a file already on disk, and twice in one session
# it did. What is left on the network is retried, and a read that failed says in
# its own words that nothing was compared: *the copies disagree* is the alarm
# here that must never cry wolf.
#
# **The check has its own tests**, and they run first. `rehearse.yml` in this
# repository already learned that a suite nobody runs is red and does not know
# it; a *check* nobody verifies is the same thing with a shorter fuse.
#
# **A failure reaches somebody.** Three silent red runs in a day is the defect
# `#79` was reopened for — the parser was only how it happened. A divergence now
# files an issue, reuses it rather than piling them up, and closes it when the
# copies agree again.
#
# **That reporting lives in `.github/scripts/red-lines-report.sh`, not here.** It
# was eight lines of YAML until `#150`, and it carried the reuse guard's defect:
# it looked the issue up through the search index, which is eventually
# consistent, so a second run inside the indexing window filed a duplicate rather
# than commenting. The lookup is now a REST listing with the title matched in the
# script — and moving it out of the `run:` block is what lets
# `.github/tests/red-lines-report.test.sh` hold the weaker form out, which a
# stubbed `gh` cannot do to a workflow step.
#
# ## Why this repository, and why `governance/red-lines.md` is the source
#
# `#78` says *"the Colony's copy binds"*, and that is addressed to a **reader**:
# an agent holding a stale skill file should trust `kolonie.about` over it. It
# does not make `about.ts` where a rule is *authored*. A red line changes by a
# governance decision, and those land here. Every other copy is a projection of
# this file, including the one that binds.
#
# ## Why the Atlas invitation is checked here too (`#399`)
#
# It is the same problem with a different subject: four lines written once in
# `governance/the-atlas.md`, copied into `arrival.md`, into `skill/body.md`, into
# every generated `SKILL.md` and into `atlasInvitation` in `about.ts` — and the
# same silent failure, because no agent reads two copies.
#
# **It costs one local file copy and no extra API calls.** Every file it compares
# is already fetched by the discovery run above; the only file the invitation
# needs that the red lines do not is its own source, which lives in this
# repository and comes off the checkout. A second workflow would have paid the
# whole discovery again to read the same bytes.
#
# **Two manifests and two reports, deliberately.** The comparisons fail
# differently: red lines disagreeing means citizens are bound on terms nobody
# decided (`p1`), an invitation disagreeing means citizens are encouraged on last
# month's terms (`p2`). One issue for both would have priced the second like the
# first, and the interruption is the expensive part.

on:
  push:
    branches: [main]
    paths:
      - 'governance/red-lines.md'
      # The source of the other thing compared here — the Atlas invitation
      # (`#399`). Same machinery, same discovery run, different subject.
      - 'governance/the-atlas.md'
      # A compared copy of both, and one that lives in this repository — so
      # editing it is an event this workflow can see, unlike a drift in a skill
      # file (#117).
      - 'onboarding/arrival.md'
      # And the copy the seven skills are generated from, readable here since
      # `#301` made this repository's copies come off the checkout.
      - 'onboarding/skill/body.md'
      - '.github/workflows/check-red-lines.yml'
      - '.github/scripts/red-lines.py'
      - '.github/scripts/find-red-line-copies.sh'
      - '.github/tests/find-red-line-copies.test.sh'
      - '.github/tests/red-lines.test.py'
      - '.github/scripts/red-lines-report.sh'
      - '.github/tests/red-lines-report.test.sh'
  pull_request:
    paths:
      - 'governance/red-lines.md'
      # The source of the other thing compared here — the Atlas invitation
      # (`#399`). Same machinery, same discovery run, different subject.
      - 'governance/the-atlas.md'
      # A compared copy of both, and one that lives in this repository — so
      # editing it is an event this workflow can see, unlike a drift in a skill
      # file (#117).
      - 'onboarding/arrival.md'
      # And the copy the seven skills are generated from, readable here since
      # `#301` made this repository's copies come off the checkout.
      - 'onboarding/skill/body.md'
      - '.github/workflows/check-red-lines.yml'
      - '.github/scripts/red-lines.py'
      - '.github/scripts/find-red-line-copies.sh'
      - '.github/tests/find-red-line-copies.test.sh'
      - '.github/tests/red-lines.test.py'
      - '.github/scripts/red-lines-report.sh'
      - '.github/tests/red-lines-report.test.sh'
  schedule:
    # Daily. The copies live in repositories this workflow cannot watch for
    # pushes, so a drift introduced in a skill file is found by the clock rather
    # than by an event.
    - cron: '0 4 * * *'
  workflow_dispatch:

# The second half of `#150`'s fix, and the cheaper half. `red-lines-report.sh`
# waits for its own issue to become findable before it exits; this stops a
# manual dispatch from starting *while* the scheduled run is inside that wait,
# which is the one window the wait cannot cover from inside. Queued, never
# cancelled: a cancelled run is one that filed and then did not wait.
#
# Grouped by ref, so a pull request's own run is not held behind main's. Those
# runs do not report at all.
concurrency:
  group: check-red-lines-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # To file the divergence where somebody will see it. Nothing else here writes.
  issues: write

jobs:
  check:
    name: the copies agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # First, because a check that has never been shown to fail correctly is a
      # check nobody should trust when it passes.
      - name: Test the checker
        run: |
          python3 .github/tests/red-lines.test.py
          bash .github/tests/find-red-line-copies.test.sh
          bash .github/tests/red-lines-report.test.sh

      - name: Find and fetch every copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/find-red-line-copies.sh "$RUNNER_TEMP/copies"

      # `continue-on-error` on both comparisons, and the job's verdict taken at
      # the end (`#399`). Without it the first failing comparison skips the
      # second, so a red-line drift would hide an invitation drift *and* leave
      # the invitation issue open after its own copies had been fixed. Both
      # subjects are reported on every run, and neither can mask the other.
      - name: Compare the red lines
        id: compare
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .github/scripts/red-lines.py "$RUNNER_TEMP/copies" 2>&1 | tee "$RUNNER_TEMP/report.txt"

      # Same directory, same fetched files, second manifest. The only file this
      # needs that the comparison above does not is its own source, and that one
      # came off the checkout.
      - name: Compare the Atlas invitation
        id: compare-invitation
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .github/scripts/red-lines.py "$RUNNER_TEMP/copies" manifest-invitation.json 2>&1 \
            | tee "$RUNNER_TEMP/report-invitation.txt"

      # Only on a real divergence, and not on a pull request: that already shows
      # its own red check to the person who opened it, and filing an issue would
      # be telling somebody about something they are looking at.
      - name: Say so where somebody will see it
        if: steps.compare.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/red-lines-report.sh report "$RUNNER_TEMP/report.txt" red-lines

      # The other half of reaching somebody: an issue that stays open after the
      # thing it reports is fixed is an issue people learn to ignore.
      - name: Close the divergence issue once they agree again
        if: steps.compare.outcome == 'success' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/red-lines-report.sh resolve red-lines

      - name: Say so about the invitation
        if: steps.compare-invitation.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/red-lines-report.sh report "$RUNNER_TEMP/report-invitation.txt" invitation

      - name: Close the invitation issue once they agree again
        if: steps.compare-invitation.outcome == 'success' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/red-lines-report.sh resolve invitation

      # The job's verdict, which `continue-on-error` took off the two steps
      # above. A run whose copies disagree is red, exactly as it was before the
      # second subject existed.
      - name: The verdict
        if: steps.compare.outcome == 'failure' || steps.compare-invitation.outcome == 'failure'
        run: |
          echo "::error::a comparison failed — see the steps above"
          exit 1
