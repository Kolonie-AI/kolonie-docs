name: What is waiting for an agent or a person

# One list a day of what nothing will come and take (`kolonie-docs#265`, `#381`,
# `#391`) — the issues no scheduler will hand to anybody, the claims nobody is
# behind, and the issues held for a member of the organisation to clear.
#
# **The workflow's name says all three and the issue's title still says one.**
# `TITLE` in the publish step below is the durable handle: the list issue is
# found by comparing that string exactly, so changing it would orphan the issue
# that exists and open a second one beside it. It is a lookup key rather than a
# description, and `.github/scripts/board-triage.sh` and
# `architecture/automation.md` both carry the same string for the same reason.
#
# `agent:opencode` has a worker. `agent:claude` and `agent:human` have nobody —
# the label says a development agent or a person should do it, and until this
# nothing told anyone one was waiting. That worked while the maintainer agent was
# in the conversation when the label was applied, and stops working the moment
# `#262` applies it at 03:20 on a Sunday.
#
# ## Where it goes
#
# `#265` offers the operator mail path or a single issue kept up to date.
# **There is no operator mail path in this repository** — checked 2026-08-10,
# nothing under `.github/workflows/` sends mail — so the mailed version would
# have meant introducing a credential in an issue that is not about credentials.
#
# So: one issue, its body rewritten in place, and **a comment only when the list
# changed**. The comment is the notification, and it fires on arrivals rather
# than on every run, because a message that is usually the same message is one
# nobody opens.
#
# ## The body is a reading, not a live view (`#385`)
#
# It used to say here that the body *is the current state and is always right*.
# It is not: it is what the search returned at the moment of the run, and every
# issue on it can close a minute later. The run of 2026-08-15 finished at 07:47
# and the first of its twelve issues closed at 07:57; by the evening four of the
# twelve were closed, and a Claude agent reading the list to build a package out
# of it found a third of what it had picked already done.
#
# Two things follow, and neither of them is a live view, because the only way to
# know an issue is still open is to ask, and asking *is* a run.
#
# **It runs every four hours rather than once a day**, which is the worker's own
# cadence and bounds the error at four hours instead of twenty-four. It costs
# five extra runs of a job that reads the board once, and it notifies nobody
# extra: the comment still fires on arrivals only.
#
# **The body says when it was read, and says an entry may have closed since.** A
# reader who can see the age of a list can decide about it; one told the list is
# always right cannot. This is the half that keeps working when a run is missed.
#
# ## What it deliberately is not
#
# **Not a comment per issue.** That is a notification per routing decision, and
# the point is a list somebody can act on in one sitting.
#
# **Not a queue.** A Claude agent takes a package and asks questions mid-work; it
# is not something a scheduler hands work to. Nothing here assigns anything.

on:
  schedule:
    # Every four hours at twenty past, clear of the checks on the hour that share
    # the GraphQL budget this reads the board with. 07:20 is kept as one of the
    # six so the list is still waiting before the maintainer's day rather than
    # after it; the other five are what stops it being a day old by the evening
    # (`#385`).
    - cron: '20 3,7,11,15,19,23 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The board as the `kolonie-opencode` app rather than as a person
      # (`#270`): its own hourly GraphQL budget, and its own name on anything it
      # touches. The token expires in an hour and is minted per run.
      - name: Become the board app
        id: board_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4

      # First, because a check nobody has verified is one nobody should trust —
      # `board-self-check.yml`'s rule, and the same reason the worker runs its
      # own test before touching the board.
      - name: Test the list logic
        run: bash .github/tests/waiting-list.test.sh

      # `BOARD_READ_TOKEN` reads the board *and* searches the issues, which is
      # the split the worker's `pick` step already uses: this step only reads,
      # and the step below it only writes.
      - name: What is waiting
        id: waiting
        env:
          GH_TOKEN: ${{ steps.board_token.outputs.token }}
        run: |
          set -uo pipefail

          # The exit code is read separately from the output, for the reason
          # `pick` learned on 2026-08-07: a query that failed and a day with
          # nothing waiting both arrive here as an empty file, and reporting
          # them the same way makes a broken list indistinguishable from a quiet
          # one. This whole workflow exists so that a routed issue is never
          # silently unheard of.
          set +e
          bash .github/scripts/waiting-list.sh entries > "$RUNNER_TEMP/entries"
          read=$?
          set -e

          if [ "$read" -ne 0 ]; then
            echo "::error::the waiting list could not be built (exit $read). Saying nothing rather than saying nothing is waiting."
            exit 1
          fi

          echo "waiting=$(wc -l < "$RUNNER_TEMP/entries")" >> "$GITHUB_OUTPUT"

      # The write, with the repository token rather than the board one — same
      # split as the worker's `Claim it` and `Say so on the issue`.
      - name: Publish the list
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: What is waiting for an agent
          WAITING: ${{ steps.waiting.outputs.waiting }}
        run: |
          set -uo pipefail

          # The list issue is found by its title, which is the only durable
          # handle: a number would have to be committed here and would be a
          # second record of a thing GitHub already holds.
          #
          # **A listing narrowed by label, and never `--search`** (`#150`,
          # `#285`). `--search "in:title …"` goes through GitHub's search index,
          # which is eventually consistent — so a run that has just created this
          # issue can look for it and not find it, and create a second one. This
          # workflow was written with a search on 2026-08-10 and the daily
          # `Check Red Lines` run went red the next morning: the guard that
          # forbids `--search` anywhere under `.github/` has stood since
          # 2026-08-03 and it caught exactly what it was built for.
          #
          # The label is the one the create branch below applies, so the two
          # cannot come apart. The title is compared here rather than by a search
          # engine's idea of a title, which is the other half of `#150`'s point.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label area:docs --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          # **Nothing when nothing is waiting** (`#265`), and that includes not
          # creating the issue on a quiet first day: a list nobody needs yet is
          # an empty daily message with extra steps.
          if [ -z "$number" ] && [ "${WAITING:-0}" -eq 0 ]; then
            echo "nothing is waiting for an agent and there is no list to correct. Saying nothing."
            exit 0
          fi

          previous="$RUNNER_TEMP/previous-body"
          : > "$previous"
          if [ -n "$number" ]; then
            gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body \
              --jq .body > "$previous" || {
              echo "::error::the list issue could not be read, and rewriting it blind would lose what is on it"
              exit 1
            }
          fi

          bash .github/scripts/waiting-list.sh body "$RUNNER_TEMP/entries" \
            > "$RUNNER_TEMP/body"
          arrivals=$(bash .github/scripts/waiting-list.sh arrivals \
            "$previous" "$RUNNER_TEMP/entries")

          if [ -z "$number" ]; then
            # `gh issue create` prints the URL and has no `--json`, so the number
            # comes off the end of it. **No `agent:` label and no priority**: the
            # list is not itself work, and labelling it would put it on itself.
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --label area:docs \
              --body-file "$RUNNER_TEMP/body") || {
              echo "::error::the list issue could not be created"
              exit 1
            }
            number=${url##*/}
            echo "opened the list as #$number"
          else
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/body" >/dev/null
            echo "rewrote #$number with $WAITING waiting issue(s)"
          fi

          # **The comment is the message, and it only fires on an arrival.** The
          # body above was just rewritten, so a run where nothing changed needs
          # no notification — and a notification that arrives on a schedule
          # whether or not anything happened is the one `#265` says nobody opens.
          # This is also what makes six runs a day cost no more attention than
          # one did (`#385`).
          if [ -z "$arrivals" ]; then
            echo "nothing new since the last run; no comment written"
            exit 0
          fi

          {
            printf '**%s issue(s) arrived on the waiting list.**\n\n' "$(wc -l <<<"$arrivals")"
            while read -r entry; do
              [ -n "$entry" ] || continue
              printf -- '- `%s`\n' "$entry"
            done <<<"$arrivals"
            printf '\nThe list above says when it was read and is rewritten every four hours; this comment is only written when something new appears on it. Nothing here is assigned — a Claude agent takes a **package**, and a package is what the list groups by (`kolonie-docs#261`, `#265`). From %s.\n' "$RUN_URL"
          } > "$RUNNER_TEMP/comment"

          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/comment" >/dev/null ||
            echo "::warning::the list was rewritten but the arrival comment could not be written"
