name: Triage the board

# One pass an hour over Inbox and Ready, so that something decides
# (`kolonie-docs#262`).
#
# ## Why it exists
#
# Measured 2026-08-10: 49 issues created in 24 hours, 46 closed, 21 of those by
# the opencode worker — and **fifteen sitting unread in Inbox while every issue
# the worker was given that day was queued by hand.** The worker exited idle on
# two runs in three. The bottleneck was not execution.
#
# ## Why :20
#
# After the hour's arrivals and clear of the checks on the hour, which is where
# `opencode-worker.yml` and the watchers already are. The worker runs on the hour
# and takes one issue from Ready; a triage pass twenty minutes later fills the
# queue it will read next time rather than racing it for the same issue.
#
# ## What it may write, and where that is enforced
#
# **Not here.** `board-triage.sh` holds every guard — Inbox and Ready are the only
# columns it reads, `agent:opencode` is refused on anything carrying
# `blocked:human`, `opencode:forbidden` or an open blocker, a route is never
# widened by a later pass, a priority is never set on an issue that arrived from
# outside, and nothing is ever removed. They are in the script because
# `.github/tests/board-triage.test.sh` can hold a script to account and cannot
# hold a `run:` block to anything.
#
# ## Two credentials, and neither can do the other's half
#
# Since `#270` the board is moved by the `kolonie-opencode` **GitHub App**, which
# holds Organization projects and Metadata and nothing else: it reads the board and
# moves a card, and it cannot label an issue or write a comment. The labels, the
# comments and the dependency links go through `WORKER_REPO_TOKEN`, which reaches
# the five repositories that carry board issues — `github.token` reaches only this
# one. `board-triage.sh` takes both and uses the app for exactly one call.

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # Two passes deciding about one issue would each comment on it. The board write
  # is the same shape as the worker's claim and this is the same protection one
  # level up: a queued pass is dropped rather than run late, because the next one
  # is twenty minutes away and reads the board fresh.
  group: board-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The board as the app rather than as a person (`#270`): its own hourly
      # GraphQL budget, and its own name on every card it moves. The token is
      # minted per run and expires in an hour.
      - name: Become the board app
        id: board_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4

      # First, because a check nobody has verified is one nobody should trust —
      # the same rule the worker and the waiting list open with, and it matters
      # more here: every guard that keeps this pass inside its permissions is in
      # the script these tests exercise.
      - name: Test the triage logic
        run: bash .github/tests/board-triage.test.sh

      - name: What is in Inbox and Ready?
        id: candidates
        env:
          # Reads the board and searches the issues, which is the split `pick`
          # already uses: this step only reads, and the step below it only writes.
          GH_TOKEN: ${{ steps.board_token.outputs.token }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/candidates.json"
          bash .github/scripts/board-triage.sh candidates > "$out" || exit 1

          waiting=$(jq '.candidates | length' "$out")
          echo "$waiting issue(s) in Inbox or Ready, $(jq '.index | length' "$out") open in total"
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # ## A few candidates at a time, against the whole board every time
      #
      # An empty pass is the good case rather than a special one — it means the
      # board is decided, and it costs one search and one board read.
      #
      # Measured 2026-08-10 on the live board: 38 candidates and 47 open issues is
      # a 154 KB brief, and the gateway answered **524** — a proxy timeout after
      # the model had been thinking for minutes. Six candidates against the same
      # whole-board index is 54 KB and answers in about fifty seconds.
      #
      # **Only the candidates are chunked.** Every call carries every open issue,
      # because *does this issue read something another open issue creates* is a
      # judgement over the whole board and is the reason this pass uses the
      # strongest model at all.
      - name: Ask the model to route them
        id: decide
        if: steps.candidates.outputs.waiting != '0'
        env:
          OPENCODE_LLM_API_KEY: ${{ secrets.OPENCODE_LLM_API_KEY }}
          OPENCODE_LLM_BASE_URL: ${{ secrets.OPENCODE_LLM_BASE_URL }}
          TRIAGE_LLM_MODEL: ${{ vars.TRIAGE_LLM_MODEL || 'gpt-5.6-sol' }}
          CHUNK: 6
          WAITING: ${{ steps.candidates.outputs.waiting }}
        run: |
          set -uo pipefail
          decisions="$RUNNER_TEMP/decisions.json"
          parts="$RUNNER_TEMP/parts"
          mkdir -p "$parts"

          offset=0
          while [ "$offset" -lt "$WAITING" ]; do
            brief="$RUNNER_TEMP/brief-$offset.md"
            bash .github/scripts/board-triage.sh brief \
              "${{ steps.candidates.outputs.file }}" "$offset" "$CHUNK" > "$brief"
            echo "issues $offset..$((offset + CHUNK - 1)): a $(wc -c < "$brief")-character brief"

            # It writes an empty decisions file and exits 0 when it cannot ask, and
            # the reason is in its own header: this runs twenty-four times a day,
            # and a provider hiccup that turned red would produce a red run nobody
            # believes. A chunk that fails costs its own issues and not the pass.
            python3 .github/scripts/board-triage-decide.py "$brief" "$parts/$offset.json"
            offset=$((offset + CHUNK))
          done

          jq -s '{decisions: map(.decisions[]?)}' "$parts"/*.json > "$decisions"
          echo "$(jq '.decisions | length' "$decisions") decision(s) in total"
          echo "decisions=$decisions" >> "$GITHUB_OUTPUT"

      - name: Label, link and move
        if: steps.decide.outputs.decisions != ''
        env:
          # The issues, in five repositories.
          GH_TOKEN: ${{ secrets.WORKER_REPO_TOKEN || github.token }}
          # The board, for the one call that moves a card.
          BOARD_TOKEN: ${{ steps.board_token.outputs.token }}
        run: |
          set -uo pipefail
          bash .github/scripts/board-triage.sh apply \
            "${{ steps.candidates.outputs.file }}" \
            "${{ steps.decide.outputs.decisions }}"

      # ## And what the refusals say that the prohibitions do not (`#264`)
      #
      # Three issues were queued on 2026-08-09 and 10 that no run could finish; each
      # produced a correct refusal, and each lesson landed in a comment and nowhere
      # else — so the second and third mistakes were made with the first one's answer
      # already written down.
      #
      # **`#264` puts this before the routing and it runs after it, deliberately.** A
      # proposal is not a rule until a person accepts it, so it cannot change what
      # this pass routes however early it runs — and at the end, a proposal step that
      # fails costs no routing. What it does change is the *next* pass, which is the
      # point.
      - name: Has a refusal outgrown the list?
        id: proposals
        env:
          GH_TOKEN: ${{ secrets.WORKER_REPO_TOKEN || github.token }}
          OPENCODE_LLM_API_KEY: ${{ secrets.OPENCODE_LLM_API_KEY }}
          OPENCODE_LLM_BASE_URL: ${{ secrets.OPENCODE_LLM_BASE_URL }}
          TRIAGE_LLM_MODEL: ${{ vars.TRIAGE_LLM_MODEL || 'gpt-5.6-sol' }}
        run: |
          set -uo pipefail
          refusals="$RUNNER_TEMP/refusals.json"
          brief="$RUNNER_TEMP/proposal-brief.md"
          proposals="$RUNNER_TEMP/proposals.json"

          bash .github/scripts/board-triage.sh refusals > "$refusals" || exit 1
          echo "$(jq '.refusals | length' "$refusals") issue(s) the worker tried and did not finish"

          bash .github/scripts/board-triage.sh proposal-brief "$refusals" > "$brief"
          python3 .github/scripts/board-triage-decide.py --propose "$brief" "$proposals"

          # The threshold and the deduplication are in the script, not in the model's
          # answer: *two, not three* is a rule with a cost.
          bash .github/scripts/board-triage.sh propose "$proposals"
