name: Triage the board

# One pass every half hour over Inbox and Ready, so that something decides
# (`kolonie-docs#262`).
#
# ## Why it exists
#
# Measured 2026-08-10: 49 issues created in 24 hours, 46 closed, 21 of those by
# the opencode worker — and **fifteen sitting unread in Inbox while every issue
# the worker was given that day was queued by hand.** The worker exited idle on
# two runs in three. The bottleneck was not execution. The maintainer increased
# this pass from hourly to half-hourly on 2026-08-11 so newly filed work waits at
# most one scheduling interval for a routing decision.
#
# ## The cadence comes from the deploy host, not from the block below
#
# **Read this before changing the `cron:`.** Since 2026-08-12 a systemd timer on
# the deploy host — `kolonie-board-triage-dispatch.timer` in `kolonie-infra`,
# `OnCalendar=*:0/30` — sends a `workflow_dispatch` every half hour. That is what
# actually paces this workflow. The `schedule:` block below is the **fallback**
# for a night when that host is down, and it is set to the same half hour so the
# two do not claim two different cadences.
#
# The reason is measured rather than assumed. `board-triage.yml` on `*/15`, over
# the 12.5 hours to 2026-08-12 17:26 UTC: **twelve firings**, gaps of 74, 107, 69,
# 71, 56, 43, 66, 86, 58, 55 and 61 minutes — a median of 66 against a cron asking
# for 15. A `workflow_dispatch` is not rationed that way; the same host's timer
# for `opencode-worker.yml` logged 121 dispatches and zero failures that day.
#
# **So a run that did not happen is a question for `journalctl -u
# kolonie-board-triage-dispatch` on the host**, not for this file. Adding
# attempts here does not buy any: that was tried, and the section below is what
# it bought.
#
# ## Why every fifteen minutes to get one every thirty — the attempt this replaces
#
# `20,50` was the first attempt at half-hourly and it asked for the wrong thing.
# Measured 2026-08-12 over the preceding sixteen hours: the `:50` pass never
# arrived once, the `:20` pass arrived between four and forty-eight minutes late,
# and two consecutive hours were dropped entirely overnight. Actual spacing was
# an hour at best. This is GitHub's documented behaviour — a scheduled run under
# load is delayed, and a delayed one is dropped rather than backfilled — and it
# is not the concurrency guard below, which never fired: every pass finishes in
# under a minute.
#
# That produced four attempts an hour rather than two, to land the two that were
# asked for — and it landed about one. The host timer above is the answer that
# worked; this block is now the fallback and asks for the cadence it wants rather
# than for double it, because a fallback that fires four times an hour on the one
# night the host is down is not what it was raised to. **The extra attempts were
# close to free either way.** `decide` is
# gated on `candidates.waiting != '0'`, so a pass over an Inbox with nothing
# untriaged pays no model at all; what it costs is a runner minute and one board
# read. A pass that finds work is the pass that was wanted.
#
# ## What it may write, and where that is enforced
#
# **Not here.** `board-triage.sh` holds every guard — Inbox and Ready are the only
# columns it reads, `agent:opencode` is refused on anything carrying
# `blocked:human`, `opencode:forbidden` or an open blocker, a route is never
# widened by a later pass, a priority is never set on an issue that arrived from
# outside, and nothing is ever removed. They are in the script because
# `.github/tests/board-triage.test.sh` can hold a script to account and cannot
# hold a `run:` block to anything.
#
# ## Two halves, and only one of them costs anything (`#289`)
#
# The model is asked about **untriaged issues only** — an issue already carrying a
# route has been decided and is not briefed, chunked or paid for again. What a
# decided issue still needs is the Ready ↔ Inbox move, and that turns on two facts
# rather than a judgement, so `sweep` makes it every pass for nothing.
#
# ## Two credentials, and neither can do the other's half
#
# Since `#270` the board is moved by the `kolonie-opencode` **GitHub App**, which
# holds Organization projects and Metadata and nothing else: it reads the board and
# moves a card, and it cannot label an issue or write a comment. The labels, the
# comments and the dependency links go through `WORKER_REPO_TOKEN`, which reaches
# the five repositories that carry board issues — `github.token` reaches only this
# one. `board-triage.sh` takes both and uses the app for exactly one call.

on:
  # The fallback, not the cadence. `kolonie-board-triage-dispatch.timer` on the
  # deploy host is what paces this — see the header.
  schedule:
    - cron: "*/30 * * * *"
  # What the host's timer calls. Everything about which issues get decided lives
  # in `board-triage.sh`; a dispatch carries no input and decides nothing.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # Two passes deciding about one issue would each comment on it. The board write
  # is the same shape as the worker's claim and this is the same protection one
  # level up: a queued pass is dropped rather than run late, because the next one
  # is at most fifteen minutes away and reads the board fresh.
  group: board-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The board as the app rather than as a person (`#270`): its own hourly
      # GraphQL budget, and its own name on every card it moves. The token is
      # minted per run and expires in an hour.
      - name: Become the board app
        id: board_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4

      # First, because a check nobody has verified is one nobody should trust —
      # the same rule the worker and the waiting list open with, and it matters
      # more here: every guard that keeps this pass inside its permissions is in
      # the script these tests exercise.
      - name: Test the triage logic
        run: |
          # `-e`, unlike the steps below: two commands in one step, and without it
          # a red first test would be green because the second one passed.
          set -euo pipefail
          bash .github/tests/board-triage.test.sh
          python3 .github/tests/board-triage-ask.test.py

      # ## Arriving, before deciding (`#332`)
      #
      # A project takes at most five `Auto-add to project` workflows; this one
      # has five and the organisation has fourteen non-archived repositories, so
      # everything past the fifth reached the board when somebody remembered.
      # **An issue that is not on the board is an issue the step below cannot
      # see**, so this runs first and on the same token — the App already holds
      # Organization projects, and nine repositories calling the Projects API
      # would mean that credential visible in nine places.
      #
      # `continue-on-error` says the same thing the script says twice over: the
      # sweep reports and never fails, and a repository it could not read must
      # not cost the pass its routing. Both numbers are in the log line
      # (`#302`).
      - name: Put anything missing on the board
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.board_token.outputs.token }}
          BOARD_TOKEN: ${{ steps.board_token.outputs.token }}
        run: |
          set -uo pipefail
          bash .github/scripts/board-triage.sh admit

      - name: What is in Inbox and Ready?
        id: candidates
        env:
          # Reads the board and searches the issues, which is the split `pick`
          # already uses: this step only reads, and the step below it only writes.
          GH_TOKEN: ${{ steps.board_token.outputs.token }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/candidates.json"
          bash .github/scripts/board-triage.sh candidates > "$out" || exit 1

          waiting=$(jq '.candidates | length' "$out")
          echo "$waiting undecided issue(s), $(jq '.queue | length' "$out") in Inbox or Ready, $(jq '.index | length' "$out") open in total"
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      # ## The half that needs no model, and runs whether or not the model does
      #
      # `#289`: the Ready ↔ Inbox move was the only reason a decided issue was read
      # again — and reading it again meant briefing it, chunking it and paying for
      # it every half hour to be told the route it already carries. *Does it have
      # an open blocker?* and *does it carry `blocked:human`?* are facts. They are
      # answered from GitHub, at no token cost, over every routed issue in the two
      # columns, and they run **before** the model step so that a gateway that is
      # down costs the pass its judgement and not its bookkeeping.
      - name: Move the cards the facts decide
        env:
          GH_TOKEN: ${{ secrets.WORKER_REPO_TOKEN || github.token }}
          BOARD_TOKEN: ${{ steps.board_token.outputs.token }}
        run: |
          set -uo pipefail
          bash .github/scripts/board-triage.sh sweep "${{ steps.candidates.outputs.file }}"

      # ## A few candidates at a time, against the whole board every time
      #
      # An empty pass is the good case rather than a special one — it means the
      # board is decided, and it costs one search and one board read.
      #
      # Measured 2026-08-10 on the live board: 38 candidates and 47 open issues is
      # a 154 KB brief, and the gateway answered **524** — a proxy timeout after
      # the model had been thinking for minutes. Six candidates against the same
      # whole-board index is 54 KB and answers in about fifty seconds.
      #
      # **Only the candidates are chunked.** Every call carries every open issue,
      # because *does this issue read something another open issue creates* is a
      # judgement over the whole board and is the reason this pass uses the
      # strongest model at all.
      - name: Ask the model to route them
        id: decide
        if: steps.candidates.outputs.waiting != '0'
        env:
          # **The triage pass is its own service and takes its own key**
          # (`#493`). D-122 §3 in `kolonie-platform` is the reason: a runaway
          # loop in one service must not take the cap for the others with it,
          # and *whose traffic is this* has to be answerable at the gateway
          # rather than only in our own logs.
          LLM_GATEWAY_API_KEY_TRIAGE: ${{ secrets.LLM_GATEWAY_API_KEY_TRIAGE }}
          LLM_GATEWAY_BASE_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
          TRIAGE_LLM_MODEL: ${{ vars.TRIAGE_LLM_MODEL || 'gpt-5.6-sol' }}
          # The account asked when the one above will not answer. Unset is
          # the other of the two names the script knows; `none` switches the
          # second attempt off. See the constants in the script for why the
          # second name is a second model rather than a second provider.
          TRIAGE_LLM_FALLBACK_MODEL: ${{ vars.TRIAGE_LLM_FALLBACK_MODEL }}
          CHUNK: 6
          WAITING: ${{ steps.candidates.outputs.waiting }}
        run: |
          set -uo pipefail
          decisions="$RUNNER_TEMP/decisions.json"
          parts="$RUNNER_TEMP/parts"
          mkdir -p "$parts"

          offset=0
          while [ "$offset" -lt "$WAITING" ]; do
            brief="$RUNNER_TEMP/brief-$offset.md"
            bash .github/scripts/board-triage.sh brief \
              "${{ steps.candidates.outputs.file }}" "$offset" "$CHUNK" > "$brief"
            echo "issues $offset..$((offset + CHUNK - 1)): a $(wc -c < "$brief")-character brief"

            # It writes an empty decisions file and exits 0 when it cannot ask, and
            # the reason is in its own header: this runs forty-eight times a day,
            # and a provider hiccup that turned red would produce a red run nobody
            # believes. A chunk that fails costs its own issues and not the pass.
            python3 .github/scripts/board-triage-decide.py "$brief" "$parts/$offset.json"
            offset=$((offset + CHUNK))
          done

          jq -s '{decisions: map(.decisions[]?)}' "$parts"/*.json > "$decisions"
          decided=$(jq '.decisions | length' "$decisions")
          echo "$decided decision(s) in total"
          echo "count=$decided" >> "$GITHUB_OUTPUT"
          echo "decisions=$decisions" >> "$GITHUB_OUTPUT"

      # `#503`: an Actions run used to leave its only trace in its own stdout,
      # which made yesterday's repeated failure impossible to query beside the
      # rest of the Colony. This emits one structured event when the ending
      # `#502` measured happens: candidates existed and no model answered.
      #
      # It is analysis, not an alarm, and it does not replace `#502`'s red run.
      # `loki-event.sh` exits 0 on every push failure, including an absent secret
      # on a fork and a 5xx from the store, because a log store being down is not
      # a finding about triage. The step still says what happened on stderr.
      - name: Record a pass where no model answered
        if: steps.decide.outcome == 'success' && steps.decide.outputs.count == '0'
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_PUSH_TOKEN: ${{ secrets.LOKI_PUSH_TOKEN }}
        run: |
          bash .github/scripts/loki-event.sh emit board-triage error \
            repository="$GITHUB_REPOSITORY" \
            run_id="$GITHUB_RUN_ID" \
            workflow="$GITHUB_WORKFLOW" \
            attempt="$GITHUB_RUN_ATTEMPT" \
            reason="candidates existed and no model answered" \
            candidates="${{ steps.candidates.outputs.waiting }}"

      - name: Label, link and move
        if: steps.decide.outputs.decisions != ''
        env:
          # The issues, in five repositories.
          GH_TOKEN: ${{ secrets.WORKER_REPO_TOKEN || github.token }}
          # The board, for the one call that moves a card.
          BOARD_TOKEN: ${{ steps.board_token.outputs.token }}
        run: |
          set -uo pipefail
          bash .github/scripts/board-triage.sh apply \
            "${{ steps.candidates.outputs.file }}" \
            "${{ steps.decide.outputs.decisions }}"

      # ## And what the refusals say that the prohibitions do not (`#264`)
      #
      # Three issues were queued on 2026-08-09 and 10 that no run could finish; each
      # produced a correct refusal, and each lesson landed in a comment and nowhere
      # else — so the second and third mistakes were made with the first one's answer
      # already written down.
      #
      # **`#264` puts this before the routing and it runs after it, deliberately.** A
      # proposal is not a rule until a person accepts it, so it cannot change what
      # this pass routes however early it runs — and at the end, a proposal step that
      # fails costs no routing. What it does change is the *next* pass, which is the
      # point.
      # `!cancelled()` and not the default, because `apply` now fails the job when
      # GitHub refused a write (`#302`). That failure is about one repository's
      # configuration and says nothing about the refusals this step reads, so
      # skipping it would make a missing label suppress an unrelated proposal —
      # exactly the silence `#302` closed, moved one step along.
      - name: Has a refusal outgrown the list?
        id: proposals
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.WORKER_REPO_TOKEN || github.token }}
          # **The triage pass is its own service and takes its own key**
          # (`#493`). D-122 §3 in `kolonie-platform` is the reason: a runaway
          # loop in one service must not take the cap for the others with it,
          # and *whose traffic is this* has to be answerable at the gateway
          # rather than only in our own logs.
          LLM_GATEWAY_API_KEY_TRIAGE: ${{ secrets.LLM_GATEWAY_API_KEY_TRIAGE }}
          LLM_GATEWAY_BASE_URL: ${{ secrets.LLM_GATEWAY_BASE_URL }}
          TRIAGE_LLM_MODEL: ${{ vars.TRIAGE_LLM_MODEL || 'gpt-5.6-sol' }}
          # The account asked when the one above will not answer. Unset is
          # the other of the two names the script knows; `none` switches the
          # second attempt off. See the constants in the script for why the
          # second name is a second model rather than a second provider.
          TRIAGE_LLM_FALLBACK_MODEL: ${{ vars.TRIAGE_LLM_FALLBACK_MODEL }}
        run: |
          set -uo pipefail
          refusals="$RUNNER_TEMP/refusals.json"
          brief="$RUNNER_TEMP/proposal-brief.md"
          proposals="$RUNNER_TEMP/proposals.json"

          bash .github/scripts/board-triage.sh refusals > "$refusals" || exit 1
          echo "$(jq '.refusals | length' "$refusals") issue(s) the worker tried and did not finish"

          bash .github/scripts/board-triage.sh proposal-brief "$refusals" > "$brief"
          python3 .github/scripts/board-triage-decide.py --propose "$brief" "$proposals"

          # The threshold and the deduplication are in the script, not in the model's
          # answer: *two, not three* is a rule with a cost.
          bash .github/scripts/board-triage.sh propose "$proposals"
